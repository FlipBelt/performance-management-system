          sending: { bg: '#eff6ff', border: '#93c5fd', color: '#1d4ed8', icon: '⏳' },
          queued:  { bg: '#fffbeb', border: '#fde68a', color: '#92400e', icon: '⏳' },
          sent:    { bg: '#f0fdf4', border: '#86efac', color: '#047857', icon: '✅' },
          error:   { bg: '#fef2f2', border: '#fecaca', color: '#dc2626', icon: '❌' },

      // Month filter bar
      html += `<div class="card" style="padding:12px 16px"><div class="flex items-center justify-between gap-3 flex-wrap">
        <label class="flex items-center gap-3" style="width:max-content;max-width:100%"><span class="text-sm font-medium text-gray-700">考核月份：</span><select class="input" data-kpi-month style="min-width:160px;padding:7px 34px 7px 11px;font-size:13px">${availableMonths.map(month => `<option value="${month}" ${state.kpiMonth === month ? 'selected' : ''}>${month}</option>`).join('')}</select></label>

        </div>

      // Department filter bar
      html += `<div class="card" style="padding:12px 16px"><div class="flex items-center gap-3 flex-wrap">
        <span class="text-sm text-gray-500" style="flex-shrink:0">选择部门：</span>
        <div class="flex gap-2 flex-wrap">${getAllDepartments().map(d =>
          `<button class="emp-btn ${state.kpiDeptFilter === d ? 'active' : ''}" data-kpi-dept="${d}" style="font-size:12px;padding:4px 12px">${d}</button>`
        ).join('')}</div>
      </div></div>`;

      // Master-detail layout: one searchable employee list and one KPI detail panel.
      let previousKpiDepartment = null;
      html += `<div class="kpi-workspace"><aside class="card kpi-person-panel" aria-label="员工列表"><input class="input" data-kpi-emp-search style="width:100%" placeholder="搜索员工"><div class="kpi-person-list">${filteredEmps.map(e => {
        const eKpis = monthKpis.filter(k => k.empId === e.id);
        const eWeight = eKpis.reduce((s, k) => s + k.weight, 0);
        const hasKpi = eKpis.length > 0;
        const isReady = eWeight === 100;
        let statusDot = '';
        if (isKpiSubmissionLocked(e.id, state.kpiMonth)) statusDot = '<span title="已归档封存" style="display:inline-block;margin-left:4px">🔒</span>';
        else if (isReady) statusDot = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#059669;margin-left:4px"></span>';

      empIds.forEach(eid => {

      if (state.selectedSubmitEmps.length === 0) {
        state.selectedSubmitEmps = readyList.map(r => r.emp.id);

    function formatArchiveTime(record) {
      if (!record) return '';
      const raw = record.archivedAt || record.confirmedAt || record.signedAt || '';
      if (!raw) return '';
      if (String(raw).includes('T')) {
        const date = new Date(raw);
        if (!Number.isNaN(date.getTime())) return date.toLocaleString('zh-CN', { hour12: false });
      }
      return raw;
    }

    function filteredEvaluationsForStageDetail() {
      let records = state.evals.filter(evaluation =>
        hasAuthorizedTargets(evaluation.empId, evaluation.month) &&
        isValidEvaluation(evaluation) &&
        evaluationParticipatesInAssessmentMonth(evaluation)
      );
      if (state.evalDeptFilter !== '全部') {
        records = records.filter(evaluation => employeeForEvaluation(evaluation)?.dept === state.evalDeptFilter);
      }
      if (state.evalMonth) records = records.filter(evaluation => evaluation.month === state.evalMonth);
      const targetMonth = state.evalMonth || DEFAULT_ASSESSMENT_MONTH;
      let pendingTargets = targetReminderCandidates(targetMonth).map(candidate => ({
        empId: candidate.employee.id,
        month: targetMonth,
        selfScore: null,
        mgrScore: null,
        bpScore: null,
        status: '待目标确认',
        targetStage: candidate.stage,
        targetStageLabel: candidate.stageLabel
      }));
      if (state.evalDeptFilter !== '全部') {
        pendingTargets = pendingTargets.filter(record => employeeForEvaluation(record)?.dept === state.evalDeptFilter);
      }
      // Pending target confirmations and signed-target evaluations are mutually
      // exclusive: a signed target is locked and therefore no longer returned
      // by targetReminderCandidates().
      return [...pendingTargets, ...records];
    }

      const stageColor = STAGE_COLORS[stage] || '#155e54';
      const rows = records.map(evaluation => {
        const employee = employeeForEvaluation(evaluation);
        if (!employee) return '';
        const resultArchive = validResultArchiveFor(evaluation.empId, evaluation.month, evaluation);
        let owner = employee.name;
        let nextAction = '完成员工自评';
        if (stage === '待目标确认') {
          nextAction = evaluation.targetStageLabel || '完成目标确认';
          if (evaluation.targetStage === 'manager-review') owner = employee.directMgr || evaluation.directMgr || '未设置';
          else if (evaluation.targetStage === 'bp-review') owner = employee.hrbp || '薏米';
          else owner = employee.name;
        }
        else if (stage === '待上级评分') { owner = employee.directMgr || evaluation.directMgr || '未设置'; nextAction = '完成上级评分'; }
        else if (stage === '待BP核准') { owner = employee.hrbp || '薏米'; nextAction = '完成BP核准'; }
        else if (stage === '待BP归档') { owner = employee.hrbp || '薏米'; nextAction = '复核员工签署结果并归档'; }
        else if (stage === '已完成') { owner = resultArchive?.doc ? '已归档' : employee.name; nextAction = resultArchive?.doc ? '流程已封存' : '完成结果签字'; }
        const isManagerTargetStage = stage === '待目标确认' && evaluation.targetStage === 'manager-review';
        const isManagerScoreStage = stage === '待上级评分';
        const canRemind = !(resultArchive && resultArchive.doc) && stage !== '待BP归档' &&
          (ACCESS_CONTEXT.global || isManagerTargetStage || isManagerScoreStage);
        return `<tr>
          <td><div class="font-medium text-gray-900">${escapeHtml(employee.name)}（${escapeHtml(employee.realName)}）</div><div class="text-xs text-gray-500">${escapeHtml(employee.dept)} · ${escapeHtml(employee.position)}</div></td>
          <td>${evaluation.selfScore ?? '--'}</td><td>${evaluation.mgrScore ?? '--'}</td><td>${evaluation.bpScore ?? '--'}</td>
          <td><div class="font-medium text-gray-900">${escapeHtml(owner)}</div><div class="text-xs text-gray-500">${escapeHtml(nextAction)}</div></td>
          <td><span class="badge ${STAGE_BADGE[stage] || 'badge-gray'}">${stage}</span></td>
          <td>${canRemind ? (evaluation.status === '待自评'
            ? `<button class="btn btn-secondary btn-sm" data-workflow-reminder="${evaluation.empId}" data-record-month="${evaluation.month}" data-workflow-action="remind-self-evaluation" style="color:#9a6700;border-color:#fde68a;background:#fffbeb">⏰ 催办自评</button>`
            : `<button class="btn btn-secondary btn-sm" data-workflow-reminder="${evaluation.empId}" data-record-month="${evaluation.month}" data-workflow-action="reminder" style="color:#9a6700;border-color:#fde68a;background:#fffbeb">⏰ 催办当前节点</button>`)
            : '<span class="badge badge-gray">无可催办项</span>'}</td>
        </tr>`;
      }).join('');
      return `<div class="modal-overlay" data-stage-detail-overlay><div class="modal-box" style="max-width:1040px" aria-labelledby="stage-detail-title">
        <div class="flex items-center justify-between mb-4"><div><h2 id="stage-detail-title">${stage}人员进度</h2><p class="subtitle" style="margin-bottom:0">${state.evalMonth} · ${state.evalDeptFilter} · 共 ${records.length} 人</p></div><button class="close-btn" data-close-stage-detail aria-label="关闭">✕</button></div>
        <div style="height:4px;border-radius:999px;background:${stageColor};margin-bottom:16px"></div>
        ${records.length ? `<div style="overflow-x:auto;border:1px solid #e5e7eb;border-radius:12px"><table style="min-width:860px"><thead><tr><th>员工</th><th>自评</th><th>上级评分</th><th>BP核准</th><th>当前负责人 / 下一步</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty-state" style="padding:52px 20px"><div style="font-size:32px;margin-bottom:10px">✓</div><strong>当前筛选范围内无“${stage}”人员</strong><div class="text-sm text-gray-500 mt-1">可关闭后查看其他流程阶段</div></div>`}
        <div class="flex justify-end" style="margin-top:18px"><button class="btn btn-primary btn-sm" data-close-stage-detail>关闭</button></div>
      </div></div>`;
    }

    function renderEvalContent() {
      if (state.selectedEmp) return renderEvalScoring();

      let confirmedEvals = state.evals.filter(e => hasAuthorizedTargets(e.empId, e.month) && isValidEvaluation(e) && evaluationParticipatesInAssessmentMonth(e));
      // Apply filters
      if (state.evalDeptFilter !== "全部") {
        confirmedEvals = confirmedEvals.filter(ev => {
          const emp = employeeForEvaluation(ev);
          return emp && emp.dept === state.evalDeptFilter;
        });
      }
      if (state.evalMonth) {
        confirmedEvals = confirmedEvals.filter(ev => ev.month === state.evalMonth);
      }
      let html = '';
      const workflowStageRecords = filteredEvaluationsForStageDetail();
      // Stage stats
      html += `<div class="grid-6">${STAGES.map(stage => {
        const count = workflowStageRecords.filter(e => e.status === stage).length;
        return `<button type="button" class="card text-center" data-eval-stage-detail="${stage}" aria-label="查看${stage}${count}人的进度明细" style="padding:12px;cursor:pointer;width:100%;font:inherit;border-color:${count ? STAGE_COLORS[stage] : '#e5e7eb'};transition:transform .14s ease,box-shadow .14s ease" title="点击查看具体人员及进度">
          <div class="text-2xl font-bold" style="color:${STAGE_COLORS[stage]}">${count}</div>
          <div class="text-xs text-gray-500 mt-1">${stage}</div><div class="text-xs mt-1" style="color:${count ? STAGE_COLORS[stage] : '#9ca3af'}">查看人员 →</div>
        </button>`;
      }).join('')}</div>`;

      html += renderMonthlyEventsPanel();

      const reminderCandidates = workflowStageRecords.filter(evaluation =>
        evaluation.status !== '待BP归档' &&
        !validResultArchiveFor(evaluation.empId, evaluation.month, evaluation)?.doc
      );
      html += `<div class="card" style="margin-top:12px"><div class="card-body flex items-center justify-between gap-3 flex-wrap" style="padding:12px 16px">
        <div><div class="font-medium text-gray-900">当前筛选范围流程催办</div><div class="text-xs text-gray-500 mt-1">系统会按每位员工的当前节点通知员工、直属上级、评分BP或结果签字人；BP结果确认由员工签字后自动推送，不纳入催办。</div></div>
        <button type="button" class="btn btn-secondary btn-sm" data-batch-workflow-reminder ${reminderCandidates.length ? '' : 'disabled'} style="color:#9a6700;border-color:#fde68a;background:#fffbeb">⏰ 一键催办（${reminderCandidates.length}人）</button>
      </div></div>`;

      if (confirmedEvals.length === 0) {
        html += `<div class="card"><div class="card-body" style="text-align:center;padding:48px 20px">
          <div style="font-size:40px;margin-bottom:12px">📋</div>
          <div class="text-gray-500 font-medium mb-1">暂无可评估人员</div>
          <div class="text-xs text-gray-400">员工完成KPI目标签字确认后，将自动出现在评估列表中</div>
        </div></div>`;
      } else {
        const headers = ["员工", "月份", "自评得分", "上级评分", "BP核准", "等级", "状态", "归档管理", "操作"];
        html += `<div class="card" style="overflow:hidden"><table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>`;
        html += confirmedEvals.map(ev => {
          const emp = employeeForEvaluation(ev);
          const displayedScore = ev.bpScore ?? ev.mgrScore ?? ev.selfScore;
          const grade = displayedScore != null ? getGrade(displayedScore) : null;
          const gradeIsFinal = ev.bpScore != null;
          const targetArchive = ARCHIVES.find(record => record.empId === ev.empId && (!ev.month || !record.month || record.month === ev.month));
          const resultArchive = validResultArchiveFor(ev.empId, ev.month, ev);
          const pendingResult = resultArchiveFor(ev.empId, ev.month);
          const reminderLabel = ev.status === '待上级评分' ? '催办上级' : ev.status === '待BP核准' ? '催办BP' : '催办签字';
          const managerScoreButton = ACCESS_CONTEXT.canManageManagerStage && ev.status === '待上级评分'
            ? `<a class="btn btn-primary btn-sm" href="/admin-manager-page/${encodeURIComponent(ev.empId)}/${encodeURIComponent(ev.month)}" target="_blank" rel="noopener">✅ 上级结果打分</a>`
            : '';
          const canRemindEvaluation = ACCESS_CONTEXT.global || ev.status === '待上级评分';
          const reminderButton = !canRemindEvaluation || resultArchive && resultArchive.doc || ev.status === '待BP归档' ? '' : (ev.status === '待自评'
            ? `<button class="btn btn-secondary btn-sm" data-workflow-reminder="${ev.empId}" data-record-month="${ev.month}" data-workflow-action="send-self-evaluation" style="color:#065f46;border-color:#a7f3d0;background:#ecfdf5">📤 发送自评</button><button class="btn btn-secondary btn-sm" data-workflow-reminder="${ev.empId}" data-record-month="${ev.month}" data-workflow-action="remind-self-evaluation" style="color:#9a6700;border-color:#fde68a;background:#fffbeb">⏰ 催办自评</button>`
            : `<button class="btn btn-secondary btn-sm" data-workflow-reminder="${ev.empId}" data-record-month="${ev.month}" data-workflow-action="reminder" style="color:#9a6700;border-color:#fde68a;background:#fffbeb">⏰ ${reminderLabel}</button>`);
          const adminBpScoreButton = ACCESS_CONTEXT.canManageResultBpStage && ev.status === '待BP核准'
            ? `<a class="btn btn-primary btn-sm" href="/admin-bp-page/${encodeURIComponent(ev.empId)}/${encodeURIComponent(ev.month)}" target="_blank" rel="noopener">✅ BP结果评分</a>`
            : '';
          return `<tr>
            <td><div class="font-medium text-gray-900">${escapeHtml(emp?.name || '未知员工')}</div><div class="text-xs text-gray-500">${escapeHtml(emp?.position || '未匹配岗位')}</div></td>
            <td class="text-gray-600">${ev.month}</td>
            <td class="text-gray-600">${ev.selfScore ?? "--"}</td>
            <td class="text-gray-600">${ev.mgrScore ?? "--"}</td>
            <td class="font-medium text-gray-900">${ev.bpScore ?? "--"}</td>
            <td>${grade ? `<span class="badge ${grade.cls}" style="font-weight:700">${grade.grade}${gradeIsFinal ? '' : '（待核定）'}</span>` : "--"}</td>
            <td><span class="badge ${STAGE_BADGE[ev.status]}">${ev.status}</span></td>
            <td style="min-width:230px"><div style="display:flex;flex-direction:column;gap:5px">
              <div class="flex items-center gap-1"><span class="text-xs text-gray-500" style="width:28px">目标</span>
                ${targetArchive && targetArchive.doc
                  ? `<button class="btn btn-secondary btn-sm" data-view-archive="${ev.empId}" data-record-month="${ev.month}" title="查看绩效目标签字确认归档" style="font-size:11px;padding:2px 7px;color:#1d4ed8;border-color:#bfdbfe;background:#eff6ff">查看归档</button><button class="btn btn-sm" data-reject-signature="kpi" data-reject-emp="${ev.empId}" data-record-month="${ev.month}" style="font-size:11px;padding:2px 7px;background:#fff1f2;color:#be123c;border:1px solid #fecdd3">打回重签</button>`
                  : `<span class="badge badge-gray" style="font-size:10px;padding:2px 6px">未归档</span>`}
              </div>
              <div class="flex items-center gap-1"><span class="text-xs text-gray-500" style="width:28px">结果</span>
                ${resultArchive && resultArchive.doc
                  ? `<button class="btn btn-secondary btn-sm" data-view-result="${ev.empId}" data-record-month="${ev.month}" title="查看绩效结果签字确认归档" style="font-size:11px;padding:2px 7px;color:#047857;border-color:#a7f3d0;background:#ecfdf5">查看归档</button><button class="btn btn-sm" data-reject-signature="result" data-reject-emp="${ev.empId}" data-record-month="${ev.month}" style="font-size:11px;padding:2px 7px;background:#fff1f2;color:#be123c;border:1px solid #fecdd3">打回重签</button>`
                  : pendingResult?.doc ? `<button class="btn btn-secondary btn-sm" data-view-result="${ev.empId}" data-record-month="${ev.month}" title="查看员工签署文件" style="font-size:11px;padding:2px 7px;color:#7c3aed;border-color:#ddd6fe;background:#f5f3ff">员工已签，待BP归档</button>` : `<span class="badge badge-gray" style="font-size:10px;padding:2px 6px">未归档</span>`}
              </div>
            </div></td>
            <td style="min-width:220px"><div class="flex items-center gap-1 flex-wrap">${managerScoreButton}${adminBpScoreButton}${reminderButton}${ev.status === '待BP归档'
              ? (ACCESS_CONTEXT.canManageResultBpStage && pendingResult?.bpReviewLink ? `<a class="btn btn-primary btn-sm" href="${escapeHtml(pendingResult.bpReviewLink)}" target="_blank" rel="noopener">BP结果核对</a>` : '<span class="badge badge-gray">等待BP处理</span>')
              : ''}</div></td>
          </tr>`;
        }).join('');
        html += `</tbody></table></div>`;
      }

      return html;
    }

    function renderEvalScoring() {
      const ev = state.evals.find(e => e.empId === state.selectedEmp && e.month === state.evalMonth);
      const emp = state.employees.find(e => e.id === state.selectedEmp);
      const empKpis = state.kpis.filter(k => k.empId === state.selectedEmp && k.month === state.evalMonth);
      const totalScore = calcWeightedScore(state.scoreMap, empKpis);
      const currentGrade = totalScore != null ? getGrade(totalScore) : null;
      const isBpStage = ev?.status === '待BP核准';

      let html = `<div class="card"><div class="card-body">
        <div class="flex items-center justify-between mb-4">
          <div><h3 class="font-medium text-gray-900">${emp?.name} — ${ev?.month}评分</h3>
          <p class="text-xs text-gray-500 mt-1">当前环节：<span class="badge ${STAGE_BADGE[ev?.status]}">${ev?.status}</span></p></div>
          <button class="close-btn" data-close-eval>✕</button>
        </div>
        <div style="border:1px solid #e5e7eb;border-radius:8px;overflow:hidden">
        <table><thead><tr>
          <th style="width:32px">#</th><th>考核指标</th><th style="width:64px">权重</th><th style="width:80px">评分</th>
        </tr></thead><tbody>`;

      html += empKpis.map(kpi => `<tr>
        <td class="text-gray-500">${kpi.seq}</td>
        <td><div class="font-medium text-gray-900">${kpi.indicator}</div><div class="text-xs text-gray-500 mt-1" style="white-space:pre-line"><strong>评分细则：</strong>${kpi.rule || '--'}</div><div class="text-xs text-gray-500 mt-1"><strong>数据来源：</strong>${kpiDataSourceValue(kpi) || '--'}</div></td>
        <td class="text-gray-600">${kpi.weight}%</td>
        <td><input class="score-input" type="number" min="0" step="1" inputmode="numeric" data-score="${kpi.seq}" value="${state.scoreMap[kpi.seq] ?? ''}" placeholder="整数"></td>
      </tr>`).join('');

      html += `<tr style="border-top:2px solid #e5e7eb;background:#f9fafb;font-weight:500">
        <td colspan="2">加权总分</td><td class="text-gray-500">100%</td>
        <td class="text-blue-600" style="font-size:16px">${totalScore ?? "--"}${currentGrade ? `<div style="margin-top:4px;font-size:11px;font-weight:700">等级：${currentGrade.grade}${isBpStage ? '' : '（待核定）'}</div>` : ''}</td>
      </tr></tbody></table></div>`;

      html += `<div class="flex mt-4" style="justify-content:flex-end">
        <button class="btn btn-primary" data-submit-eval>✅ 提交评分</button>
      </div></div></div>`;

      return html;
    }

    function scoredResultsForCurrentFilters() {
      let results = state.evals.filter(ev => isValidEvaluation(ev) && evaluationParticipatesInAssessmentMonth(ev)).map(ev => {
        const emp = employeeForEvaluation(ev);
        const score = ev.bpScore ?? ev.mgrScore ?? ev.selfScore;
        const grade = score != null ? getGrade(score) : null;
        return { ...ev, emp, score, grade };
      }).filter(r => r.score != null);
      if (state.evalDeptFilter !== "全部") {
        results = results.filter(r => r.emp?.dept === state.evalDeptFilter);
      }
      if (state.evalMonth) {
        results = results.filter(r => r.month === state.evalMonth);
      }
      results.sort((a, b) => (b.score || 0) - (a.score || 0));
      return results;
    }

    function renderResultGradeCounts(results) {
      const dist = {};
      GRADE_RULES.forEach(g => { dist[g.grade] = 0; });
      results.forEach(r => { if (r.grade) dist[r.grade.grade]++; });
      return `<div class="grid-6" data-result-grade-summary>${GRADE_RULES.filter(g => g.grade !== "D").map(g => `
        <div class="card text-center" style="padding:12px">
          <span class="badge ${g.cls}" style="font-weight:700">${g.grade}</span>
          <div class="text-xl font-bold mt-2" style="color:${g.color}">${dist[g.grade]}</div>
          <div class="text-xs text-gray-500">${g.label} · ${g.coeff}x</div>
        </div>`).join('')}
        <div class="card text-center" style="padding:12px">
          <div class="text-sm font-medium text-gray-500">合计</div>
          <div class="text-xl font-bold mt-2 text-gray-900">${results.length}</div>
          <div class="text-xs text-gray-500">考核人数</div>
        </div>
      </div>`;
    }

    function renderResultsContent() {
      const abnormal = state.evals.filter(e => e.status === "已完成" && !isValidEvaluation(e) && evaluationParticipatesInAssessmentMonth(e) && (!state.evalMonth || e.month === state.evalMonth));
      let completed = state.evals.filter(e => ["已完成", "待BP归档"].includes(e.status) && isValidEvaluation(e) && evaluationParticipatesInAssessmentMonth(e));
      // Apply filters
      if (state.evalDeptFilter !== "全部") {
        completed = completed.filter(ev => {
          const emp = state.employees.find(e => e.id === ev.empId);
          return emp && emp.dept === state.evalDeptFilter;
        });
      }
      if (state.evalMonth) {
        completed = completed.filter(ev => ev.month === state.evalMonth);
      }

      let pending = state.evals.filter(e => !["已完成", "待BP归档"].includes(e.status) && isValidEvaluation(e) && evaluationParticipatesInAssessmentMonth(e));
      if (state.evalMonth) pending = pending.filter(e => e.month === state.evalMonth);
      if (state.evalDeptFilter !== "全部") pending = pending.filter(ev => state.employees.find(emp => emp.id === ev.empId)?.dept === state.evalDeptFilter);

      let html = '';

      if (abnormal.length) {
        html += `<div class="alert alert-red" role="alert"><strong>${abnormal.length} 条异常评分已被阻止进入结果确认和归档。</strong> 请修正后重新同步。</div>`;
      }

      if (pending.length > 0) {
        const names = pending.map(e => state.employees.find(emp => emp.id === e.empId)?.name).join("、");
        html += `<div class="alert alert-amber">
          <div class="flex items-center gap-2 mb-1"><span>⚠️</span><span class="font-medium text-sm">待完成</span></div>
          <p class="text-sm">还有 ${pending.length} 人未完成评估：${names}</p>
        </div>`;
      }

      // Result archive management button
      const completedIds = completed.map(e => e.empId);
      const signedCount = completed.filter(ev => validResultArchiveFor(ev.empId, ev.month, ev)).length;
      html += `<div class="card" style="padding:12px 16px"><div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="badge badge-green" style="font-size:13px;padding:4px 12px">${signedCount} 人已签名归档</span>
          <span class="badge badge-gray" style="font-size:13px;padding:4px 12px">${completedIds.length - signedCount} 人待确认</span>
        </div>
        <button class="btn btn-secondary btn-sm" data-toggle-confirm-list data-archive-tab="result">📁 统一归档管理</button>
      </div></div>`;

      html += renderResultGradeCounts(scoredResultsForCurrentFilters());

      const headers = ["姓名", "岗位", "月度得分", "绩效等级", "绩效系数", "考评人", "BP核准", "员工确认"];
      html += `<div class="card" style="overflow:hidden">
        <div class="card-header">
          <h3 class="font-medium text-gray-900 flex items-center gap-2">📄 绩效结果确认单</h3>
          <p class="text-xs text-gray-500 mt-1">${state.evalMonth} · 杭州飞途行远</p>
        </div>
        <table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>`;

      if (completed.length === 0) {
        html += `<tr><td colspan="8" class="text-center text-gray-500" style="padding:32px">暂无已完成的绩效结果</td></tr>`;
      } else {
        html += completed.map(ev => {
          const emp = employeeForEvaluation(ev);
          const grade = getGrade(ev.bpScore);
          const resultArch = validResultArchiveFor(ev.empId, ev.month, ev);
          const signedPendingReview = resultArchiveFor(ev.empId, ev.month);
          const confirmed = !!resultArch;
          return `<tr>
            <td class="font-medium text-gray-900">${emp?.name}（${emp?.realName}）</td>
            <td class="text-gray-600">${emp?.position}</td>
            <td class="font-bold text-gray-900">${ev.bpScore}</td>
            <td>${grade ? `<span class="badge ${grade.cls}" style="font-weight:700">${grade.grade}</span>` : "--"}</td>
            <td class="font-medium" style="color:${grade?.color}">${grade?.coeff}</td>
            <td class="text-gray-600">${emp?.directMgr}</td>
            <td class="text-gray-600">${emp?.hrbp}</td>
            <td>${confirmed
              ? `<button class="btn btn-secondary btn-sm" data-view-result="${ev.empId}" data-record-month="${ev.month}" style="font-size:12px">✓ 已签名归档</button>`
              : signedPendingReview?.doc
                ? `<div class="flex items-center gap-2"><button class="btn btn-secondary btn-sm" data-view-result="${ev.empId}" data-record-month="${ev.month}" style="font-size:11px;color:#7c3aed;border-color:#ddd6fe;background:#f5f3ff">员工已签，待BP归档</button>${signedPendingReview.bpReviewLink ? `<a class="btn btn-primary btn-sm" href="${escapeHtml(signedPendingReview.bpReviewLink)}" target="_blank" rel="noopener">BP结果核对</a>` : ''}</div>`
                : `<div class="flex items-center gap-2"><span class="text-xs text-amber-600">待确认</span><button class="btn btn-secondary btn-sm" data-workflow-reminder="${ev.empId}" data-record-month="${ev.month}" style="font-size:11px;color:#9a6700;border-color:#fde68a;background:#fffbeb">⏰ 催办结果签字</button></div>`}</td>
          </tr>`;
        }).join('');
      }
      html += `</tbody></table></div>`;

      if (completed.length > 0) {
        const avgScore = Math.round(completed.reduce((s, e) => s + (e.bpScore || 0), 0) / completed.length * 10) / 10;
        const avgCoeff = (Math.round(completed.reduce((s, e) => s + (getGrade(e.bpScore)?.coeff || 0), 0) / completed.length * 100) / 100).toFixed(2);
        html += `<div class="card"><div class="card-body">
          <h3 class="font-medium text-gray-900 mb-3">汇总统计</h3>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;text-align:center">
            <div style="padding:12px;background:#f9fafb;border-radius:8px">
              <div class="text-2xl font-bold text-gray-900">${avgScore}</div>
              <div class="text-xs text-gray-500 mt-1">团队平均分</div>
            </div>
            <div style="padding:12px;background:#f9fafb;border-radius:8px">
              <div class="text-2xl font-bold text-gray-900">${avgCoeff}</div>
              <div class="text-xs text-gray-500 mt-1">平均绩效系数</div>
            </div>
            <div style="padding:12px;background:#f9fafb;border-radius:8px">
              <div class="text-2xl font-bold text-gray-900">${completed.length}</div>
              <div class="text-xs text-gray-500 mt-1">已确认人数</div>
            </div>
          </div>
        </div></div>`;
      }

      return html;
    }

    // ===== EVENTS =====
    function attachEvents() {
      // Persist KPI form contents on every keystroke. Background polling may
      // update state, but the draft remains available until Save or Cancel.
      ['edit-indicator', 'edit-source', 'edit-rule', 'edit-weight'].forEach(id => {
        const field = document.getElementById(id);
        if (field) field.addEventListener('input', saveKpiDraftFromEditor);
      });

      // Tabs
      document.querySelectorAll('[data-tab]').forEach(el => {
        el.addEventListener('click', async () => {
          state.activeTab = parseInt(el.dataset.tab);
          syncFromServer();
          state.selectedEmp = null;
          state.sendStatus = null; // dismiss banner on tab switch
          render();
          if (state.activeTab === 4 && ACCESS_CONTEXT.canViewOperationLogs) {
            await refreshOperationLogs();
            render();
          }
        });
      });

      document.querySelectorAll('[data-refresh-operation-logs]').forEach(button => button.addEventListener('click', async () => {
        await refreshOperationLogs();
        render();
      }));
      document.querySelectorAll('[data-operation-filter]').forEach(field => field.addEventListener('change', () => {
        state.operationLogFilters[field.dataset.operationFilter] = field.value;
        render();
      }));
      document.querySelectorAll('[data-operation-search]').forEach(field => field.addEventListener('input', () => {
        state.operationLogFilters.keyword = field.value;
        render();
        const next = document.querySelector('[data-operation-search]');
        if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); }
      }));

      const globalSearch = document.querySelector('[data-global-search]');
      if (globalSearch) {
        globalSearch.addEventListener('keydown', event => {
          if (event.key !== 'Enter') return;
          const query = globalSearch.value.trim().toLowerCase();
          if (!query) return;
          const employee = state.employees.find(item => [item.name, item.realName, item.dept, item.position].some(value => String(value || '').toLowerCase().includes(query)));
          if (!employee) {
            globalSearch.setCustomValidity('未找到匹配的员工、部门或岗位');
            globalSearch.reportValidity();
            return;
          }
          globalSearch.setCustomValidity('');
          state.activeTab = 1;
          state.deptFilter = employee.dept;
          render();
          requestAnimationFrame(() => {
            const row = [...document.querySelectorAll('tbody tr')].find(item => item.textContent.includes(employee.name) && item.textContent.includes(employee.realName));
            if (row) {
              row.classList.add('search-hit');
              row.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
          });
        });
        globalSearch.addEventListener('input', () => globalSearch.setCustomValidity(''));
      }

      // Dismiss send status banner
      document.querySelectorAll('[data-dismiss-status]').forEach(el => {
        el.addEventListener('click', () => {
          state.sendStatus = null;
          state.sendStatusMsg = '';
          render();
        });
      });

      // Employee buttons in KPI tab
      document.querySelectorAll('[data-emp]').forEach(el => {
        el.addEventListener('click', () => {
          state.selectedKpiEmp = el.dataset.emp;
          state.selectedKpiMode = el.dataset.kpiMode === 'okr' ? 'okr' : 'kpi';
          state.editingKpi = null;
          state.selectedMergeKpis = [];
          render();
        });
      });
      const kpiEmployeeSearch = document.querySelector('[data-kpi-emp-search]');
      if (kpiEmployeeSearch) kpiEmployeeSearch.addEventListener('input', () => {
        const keyword = kpiEmployeeSearch.value.trim().toLowerCase();
        document.querySelectorAll('[data-kpi-person]').forEach(item => {
          item.hidden = Boolean(keyword && !String(item.dataset.searchText || '').toLowerCase().includes(keyword));
        });
      });

      // Department filter in employee management tab
      document.querySelectorAll('[data-dept-filter]').forEach(el => {
        el.addEventListener('click', () => {
          state.deptFilter = el.dataset.deptFilter;
          render();
        });
      });

      // Month filter in KPI tab
      document.querySelectorAll('[data-kpi-month]').forEach(el => {
        el.addEventListener('change', () => {
          state.kpiMonth = el.value;
          state.editingKpi = null;
          state.selectedMergeKpis = [];
          // Auto-select first employee in current dept filter
          const activeEmps = state.kpiDeptFilter === "全部"
            ? state.employees.filter(e => !state.removedEmps.includes(e.id) && employeeParticipatesInMonth(e, state.kpiMonth))
            : state.employees.filter(e => e.dept === state.kpiDeptFilter && !state.removedEmps.includes(e.id) && employeeParticipatesInMonth(e, state.kpiMonth));
          if (activeEmps.length > 0) {
            state.selectedKpiEmp = activeEmps[0].id;
            state.selectedKpiMode = 'kpi';
          }
          render();
        });
      });

      document.querySelectorAll('[data-add-monthly-event]').forEach(button => {
        button.addEventListener('click', () => {
          if (!ACCESS_CONTEXT.canManageMonthlyEvents) return;
          const range = monthlyEventDateRange(state.evalMonth);
          state.monthlyEventEditor = { month: state.evalMonth, department: state.evalDeptFilter === '全部' ? '' : state.evalDeptFilter, empId: '', date: range.first, summary: '', details: '', images: [] };
          render();
        });
      });
      document.querySelectorAll('[data-preview-monthly-event-image]').forEach(button => {
        button.addEventListener('click', () => {
          const event = (state.monthlyEvents || []).find(item => item.id === button.dataset.previewMonthlyEventImage);
          const image = event && Array.isArray(event.images) ? event.images[Number(button.dataset.monthlyEventImageIndex)] : null;
          if (!image || !image.dataUrl) return;
          state.monthlyEventImagePreview = { name: image.name || `${event.summary || '事件'}图片`, dataUrl: image.dataUrl };
          render();
        });
      });
      document.querySelectorAll('[data-close-monthly-event-preview]').forEach(button => button.addEventListener('click', () => { state.monthlyEventImagePreview = null; render(); }));
      document.querySelectorAll('[data-monthly-event-preview-overlay]').forEach(overlay => overlay.addEventListener('click', event => {
        if (event.target === overlay) { state.monthlyEventImagePreview = null; render(); }
      }));
      document.querySelectorAll('[data-edit-monthly-event]').forEach(button => {
        button.addEventListener('click', () => {
          if (!ACCESS_CONTEXT.canManageMonthlyEvents) return;
          const event = (state.monthlyEvents || []).find(item => item.id === button.dataset.editMonthlyEvent);
          if (!event) return;
          state.monthlyEventEditor = JSON.parse(JSON.stringify(event));
          render();
        });
      });
      document.querySelectorAll('[data-close-monthly-event]').forEach(button => button.addEventListener('click', () => { state.monthlyEventEditor = null; render(); }));
      document.querySelectorAll('[data-monthly-event-overlay]').forEach(overlay => overlay.addEventListener('click', event => {
        if (event.target === overlay) { state.monthlyEventEditor = null; render(); }
      }));
      document.querySelectorAll('[data-monthly-event-field]').forEach(field => {
        const update = () => {
          if (!state.monthlyEventEditor) return;
          const name = field.dataset.monthlyEventField;
          state.monthlyEventEditor[name] = field.value;
          if (name === 'department') {
            state.monthlyEventEditor.empId = '';
            render();
          }
        };
        field.addEventListener(field.tagName === 'SELECT' || field.type === 'date' ? 'change' : 'input', update);
      });
      document.querySelectorAll('[data-monthly-event-images]').forEach(input => input.addEventListener('change', async () => {
        if (!state.monthlyEventEditor) return;
        const existing = Array.isArray(state.monthlyEventEditor.images) ? state.monthlyEventEditor.images : [];
        const files = [...input.files];
        if (existing.length + files.length > 5) return alert('每条事件最多上传5张图片');
        const allowed = new Set(['image/png', 'image/jpeg', 'image/webp', 'image/gif']);
        if (files.some(file => !allowed.has(file.type))) return alert('仅支持 JPG、PNG、WebP、GIF 图片');
        if (files.some(file => file.size > 2 * 1024 * 1024)) return alert('单张图片不能超过2MB');
        const read = file => new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve({ name: file.name, dataUrl: String(reader.result || '') }); reader.onerror = () => reject(new Error('图片读取失败')); reader.readAsDataURL(file); });
        try {
          state.monthlyEventEditor.images = existing.concat(await Promise.all(files.map(read)));
          render();
        } catch (error) { alert(error.message); }
      }));
      document.querySelectorAll('[data-remove-monthly-event-image]').forEach(button => button.addEventListener('click', () => {
        if (!state.monthlyEventEditor) return;
        state.monthlyEventEditor.images.splice(Number(button.dataset.removeMonthlyEventImage), 1);
        render();
      }));
      document.querySelectorAll('[data-save-monthly-event]').forEach(button => button.addEventListener('click', async () => {
        if (!state.monthlyEventEditor || !ACCESS_CONTEXT.canManageMonthlyEvents) return;
        button.disabled = true;
        button.textContent = '保存中…';
        try {
          const response = await fetch(SYNC_SERVER_URL + '/monthly-events', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'upsert', ...state.monthlyEventEditor, month: state.evalMonth }) });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.error || '保存失败');
          state.monthlyEvents = result.events || [];
          state.monthlyEventEditor = null;
          render();
        } catch (error) {
          alert('每月事件保存失败：' + error.message);
          button.disabled = false;
          button.textContent = '保存事件';
        }
      }));
      document.querySelectorAll('[data-delete-monthly-event]').forEach(button => button.addEventListener('click', async () => {
        if (!ACCESS_CONTEXT.canManageMonthlyEvents || !confirm('确定删除这条每月事件吗？')) return;
        button.disabled = true;
        try {
          const response = await fetch(SYNC_SERVER_URL + '/monthly-events', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'delete', id: button.dataset.deleteMonthlyEvent }) });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.error || '删除失败');
          state.monthlyEvents = result.events || [];
          render();
        } catch (error) { alert('每月事件删除失败：' + error.message); button.disabled = false; }
      }));

      document.querySelectorAll('[data-okr-invite]').forEach(button => {
        button.addEventListener('click', async () => {
          const empId = button.dataset.okrInvite;
          const recordKey = assessmentKey(empId, state.kpiMonth);
          button.disabled = true;
          button.textContent = '发送中…';
          try {
            const response = await fetch(SYNC_SERVER_URL + '/okr-invite', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ empId, month: state.kpiMonth })
            });
            const result = await response.json();
            if (!response.ok || !result.success) throw new Error(result.error || '邀请失败');
            if (result.record) state.okrRecords[recordKey] = result.record;
            alert(result.alreadyInvited ? 'OKR流程已经启动，本次未重复发送邀请。' : 'OKR填写邀请已发送。');
            render();
            refreshOkrRecords().catch(() => {});
          } catch (error) {
            // The server may already have accepted and delivered the invitation
            // even if the browser connection was interrupted. Reconcile with
            // the authoritative workflow before reporting a failure or
            // allowing another click.
            try {
              const records = await refreshOkrRecords();
              if (records[recordKey]) {
                alert('OKR邀请已由服务器受理，流程状态已恢复，本次不会重复发送。');
                render();
                return;
              }
            } catch (_) {}
            alert('网络连接异常，暂时无法确认邀请结果。为避免重复通知，请稍后刷新状态后再操作。');
            button.disabled = false;
            button.textContent = '🔗 邀请员工填写OKR';
          }
        });
      });

      document.querySelectorAll('[data-okr-send-self]').forEach(button => {
        button.addEventListener('click', async () => {
          const empId = button.dataset.okrSendSelf;
          const employee = state.employees.find(item => item.id === empId);
          if (!confirm(`确认向${employee?.name || '该员工'}发送${state.kpiMonth} OKR自评通知吗？`)) return;
          button.disabled = true;
          button.textContent = '发送中…';
          try {
            const response = await fetch(SYNC_SERVER_URL + '/okr-send-self-review', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ empId, month: state.kpiMonth })
            });
            const result = await response.json();
            if (!response.ok || !result.success) throw new Error(result.error || '发送失败');
            const recordsResponse = await fetch(SYNC_SERVER_URL + '/okr-data');
            if (!recordsResponse.ok) throw new Error('流程状态刷新失败');
            state.okrRecords = await recordsResponse.json() || {};
            alert('OKR自评通知已发送。');
            render();
          } catch (error) {
            alert('OKR自评通知发送失败：' + error.message);
            button.disabled = false;
            button.textContent = '📤 发送OKR自评';
          }
        });
      });

      document.querySelectorAll('[data-okr-remind]').forEach(button => {
        button.addEventListener('click', async () => {
          button.disabled = true;
          try {
            const response = await fetch(SYNC_SERVER_URL + '/okr-remind', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ empId: button.dataset.okrRemind, month: state.kpiMonth })
            });
            const result = await response.json();
            if (!response.ok || !result.success) throw new Error(result.error || '催办失败');
            alert('OKR当前节点催办已发送。');
          } catch (error) {
            alert('OKR催办失败：' + error.message);
          } finally {
            button.disabled = false;
          }
        });
      });

      // Copy previous month's KPI
      const copyPreviousKpisToCurrent = (empId, currentMonth) => {
        const monthMatch = currentMonth.match(/(\d+)年(\d+)月/);
        if (!monthMatch) { alert('无法解析当前月份'); return false; }
        let prevYear = parseInt(monthMatch[1]);
        let prevMonthNum = parseInt(monthMatch[2]) - 1;
        if (prevMonthNum < 1) { prevMonthNum = 12; prevYear--; }
        const prevMonth = prevYear + '年' + prevMonthNum + '月';
        const prevKpis = state.kpis.filter(k => k.empId === empId && k.month === prevMonth);
        if (prevKpis.length === 0) {
          alert(prevMonth + ' 没有该员工的KPI数据，无法复制。请手动创建。');
          return false;
        }
        const existingMax = state.kpis.filter(k => k.empId === empId && k.month === currentMonth).length;
        if (existingMax > 0) {
          alert('当前月份已有KPI数据，无法覆盖。请先删除现有指标。');
          return false;
        }
        prevKpis.forEach(k => {
          state.kpis.push({
            empId: k.empId, seq: k.seq, indicator: k.indicator,
            rule: k.rule, weight: k.weight, target: '', dataSource: kpiDataSourceValue(k),
            items: Array.isArray(k.items) ? k.items.map(item => ({ ...item, target: '', dataSource: kpiDataSourceValue(item) })) : [],
            month: currentMonth
          });
        });
        state.editingKpi = null;
        alert('已从 ' + prevMonth + ' 复制 ' + prevKpis.length + ' 条KPI指标到 ' + currentMonth);
        return true;
      };
      document.querySelectorAll('[data-copy-prev-month]').forEach(el => {
        el.addEventListener('click', () => {
          if (copyPreviousKpisToCurrent(state.selectedKpiEmp, state.kpiMonth)) render();
        });
      });

      document.querySelectorAll('[data-takeover-target-mode]').forEach(el => {
        el.addEventListener('click', async () => {
          const mode = el.dataset.takeoverTargetMode;
          const empId = state.selectedKpiEmp;
          const emp = state.employees.find(item => item.id === empId);
          if (!emp) return alert('未找到员工资料，请刷新后重试。');
          const actionLabel = mode === 'copy' ? '从上月复制' : '新建空白目标';
          if (!confirm('确定撤回“' + emp.name + '”的员工填写邀请，并改为“' + actionLabel + '”吗？\n\n撤回后，已发送的员工填写链接会立即失效。')) return;
          const original = el.textContent;
          el.disabled = true;
          el.textContent = '切换中…';
          try {
            const response = await fetch(SYNC_SERVER_URL + '/withdraw-target-invitation', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ empId, month: state.kpiMonth })
            });
            const responseText = await response.text();
            let result = {};
            try { result = responseText ? JSON.parse(responseText) : {}; }
            catch (_) { throw new Error(responseText || '服务器返回了无法识别的响应'); }
            if (!response.ok || !result.success) throw new Error(result.error || '撤回邀请失败');
            delete state.targetDrafts[assessmentKey(empId, state.kpiMonth)];
            if (mode === 'copy') {
              if (!copyPreviousKpisToCurrent(empId, state.kpiMonth)) state.editingKpi = 0;
            } else {
              state.editingKpi = 0;
            }
            render();
          } catch (error) {
            alert('切换目标制定方式失败：' + error.message);
            el.disabled = false;
            el.textContent = original;
          }
        });
      });

      // Add blank KPI (when no KPIs exist for this month)
      document.querySelectorAll('[data-add-kpi-blank]').forEach(el => {
        el.addEventListener('click', () => {
          state.editingKpi = 0;
          render();
        });
      });

      // Department filter in KPI tab
      document.querySelectorAll('[data-kpi-dept]').forEach(el => {
        el.addEventListener('click', () => {
          state.kpiDeptFilter = el.dataset.kpiDept;
          state.selectedMergeKpis = [];
          // Auto-select first employee in the filtered department
          const filteredEmps = el.dataset.kpiDept === "全部"
            ? state.employees.filter(e => !state.removedEmps.includes(e.id) && employeeParticipatesInMonth(e, state.kpiMonth))
            : state.employees.filter(e => e.dept === el.dataset.kpiDept && !state.removedEmps.includes(e.id) && employeeParticipatesInMonth(e, state.kpiMonth));
          if (filteredEmps.length > 0 && !filteredEmps.find(e => e.id === state.selectedKpiEmp)) {
            state.selectedKpiEmp = filteredEmps[0].id;
            state.selectedKpiMode = 'kpi';
          }
          state.editingKpi = null;
          render();
        });
      });

      // Kanban month filter
      document.querySelectorAll('[data-kanban-month]').forEach(el => {
        el.addEventListener('change', () => {
          state.kanbanMonth = el.value;
          render();
        });
      });

      document.querySelectorAll('[data-dashboard-drill]').forEach(el => {
        el.addEventListener('click', () => {
          const employee = state.employees.find(item => item.id === el.dataset.dashboardDrill);
          if (!employee) return;
          state.activeTab = 3;
          state.evalMonth = state.kanbanMonth;
          state.evalDeptFilter = employee.dept;
          state.evalSubTab = 'evaluation';
          state.selectedEmp = employee.id;
          render();
          refreshMonthlyEvents(state.evalMonth).catch(() => {});
          requestAnimationFrame(() => {
            const row = [...document.querySelectorAll('tbody tr')].find(item => item.textContent.includes(employee.name));
            if (row) {
              row.classList.add('search-hit');
              row.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
          });
        });
      });

      // Evaluation sub-tab
      document.querySelectorAll('[data-eval-subtab]').forEach(el => {
        el.addEventListener('click', () => {
          state.evalSubTab = el.dataset.evalSubtab;
          state.selectedEmp = null;
          render();
        });
      });

      document.querySelectorAll('[data-eval-stage-detail]').forEach(el => {
        el.addEventListener('click', () => {
          state.evalStageDetail = el.dataset.evalStageDetail;
          render();
        });
      });

      document.querySelectorAll('[data-close-stage-detail]').forEach(el => {
        el.addEventListener('click', () => {
          state.evalStageDetail = null;
          render();
        });
      });

      document.querySelectorAll('[data-stage-detail-overlay]').forEach(el => {
        el.addEventListener('click', event => {
          if (event.target !== el) return;
          state.evalStageDetail = null;
          render();
        });
      });

      // Evaluation dept filter
      document.querySelectorAll('[data-eval-dept]').forEach(el => {
        el.addEventListener('click', () => {
          state.evalDeptFilter = el.dataset.evalDept;
          render();
        });
      });

      // Evaluation month filter
      document.querySelectorAll('[data-eval-month]').forEach(el => {
        el.addEventListener('change', () => {
          state.evalMonth = el.value;
          render();
          refreshMonthlyEvents(state.evalMonth).catch(() => {});
        });
      });

      // Employee management month filter
      document.querySelectorAll('[data-emp-month]').forEach(el => {
        el.addEventListener('change', () => {
          state.empMonth = el.value;
          render();
        });
      });

      // Load one searchable manager picker on demand instead of rendering thousands of select options.
      document.querySelectorAll('[data-open-manager]').forEach(el => {
        el.addEventListener('click', () => { state.managerEditorEmpId = el.dataset.openManager; render(); });
      });
      document.querySelectorAll('[data-close-manager]').forEach(el => {
        el.addEventListener('click', () => { state.managerEditorEmpId = null; render(); });
      });
      document.querySelectorAll('[data-manager-overlay]').forEach(el => {
        el.addEventListener('click', event => { if (event.target === el) { state.managerEditorEmpId = null; render(); } });
      });
      const managerSearch = document.querySelector('[data-manager-search]');
      if (managerSearch) managerSearch.addEventListener('input', () => {
        const keyword = managerSearch.value.trim().toLowerCase();
        document.querySelectorAll('[data-manager-choice]').forEach(item => {
          item.hidden = Boolean(keyword && !String(item.dataset.searchText || item.textContent).toLowerCase().includes(keyword));
        });
      });
      document.querySelectorAll('[data-manager-choice]').forEach(el => {
        el.addEventListener('click', async () => {
          const emp = state.employees.find(employee => employee.id === state.managerEditorEmpId);
          if (!emp) {
            alert('员工资料尚未同步，请刷新通讯录后重试。');
            return;
          }
          const nextManager = el.dataset.managerChoice || '';
          const previousManager = emp.directMgr || '';
          emp.directMgr = nextManager;
          state.evals.filter(evaluation => evaluation.empId === emp.id).forEach(evaluation => { evaluation.directMgr = nextManager; });
          state.managerEditorEmpId = null;
          render();
          try {
            const response = await fetch(SYNC_SERVER_URL + '/employee-overrides', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: emp.name, directMgr: nextManager })
            });
            const responseText = await response.text();
            let result = {};
            try { result = responseText ? JSON.parse(responseText) : {}; }
            catch (_) { throw new Error(responseText || '服务器返回了无法识别的响应'); }
            if (!response.ok || !result.success) throw new Error(result.error || '保存失败');
          } catch (error) {
            emp.directMgr = previousManager;
            state.evals.filter(evaluation => evaluation.empId === emp.id).forEach(evaluation => { evaluation.directMgr = previousManager; });
            render();
            alert('直属上级保存失败：' + error.message);
          }
        });
      });

      // Remove employee from performance evaluation
      document.querySelectorAll('[data-remove-emp]').forEach(el => {
        el.addEventListener('click', async () => {
          const empId = el.dataset.removeEmp;
          const emp = state.employees.find(e => e.id === empId);
          if (!emp) return;
          if (!confirm('确定将 ' + emp.name + '（' + emp.realName + '）从绩效考核中移除？\n移除后该员工将不参与本月绩效考核。')) return;
          if (!state.removedEmps.includes(empId)) state.removedEmps.push(empId);
          // Clean up KPI and evaluation data for removed employee
          state.kpis = state.kpis.filter(k => k.empId !== empId);
          state.evals = state.evals.filter(e => e.empId !== empId);
          render();
          try {
            const response = await fetch(SYNC_SERVER_URL + '/performance-exclusions', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ empId, excluded: true })
            });
            if (!response.ok) throw new Error(await response.text());
          } catch (error) {
            state.removedEmps = state.removedEmps.filter(id => id !== empId);
            render();
            alert('移出考核保存失败：' + error.message);
          }
        });
      });

      // Show removed employees
      document.querySelectorAll('[data-show-removed]').forEach(el => {
        el.addEventListener('click', () => {
          const names = state.removedEmps.map(id => {
            const emp = state.employees.find(e => e.id === id);
            return emp ? emp.name + '（' + emp.realName + '）' : id;
          }).join('、');
          if (confirm('已移除的员工：' + names + '\n\n是否恢复所有已移除的员工？')) {
            state.removedEmps = [];
            render();
            fetch(SYNC_SERVER_URL + '/performance-exclusions', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ excludedEmpIds: [] })
            }).then(response => {
              if (!response.ok) throw new Error('服务器保存失败');
            }).catch(error => alert('恢复员工保存失败：' + error.message));
          }
        });
      });

      // Add KPI
      document.querySelectorAll('[data-add-kpi]').forEach(el => {
        el.addEventListener('click', () => {
          state.editingKpi = 0;
          render();
        });
      });

      // Select two or more KPI cards and merge them into one parent KPI.
      document.querySelectorAll('[data-merge-kpi]').forEach(el => {
        el.addEventListener('change', () => {
          const seq = Number(el.dataset.mergeKpi);
          if (el.checked) {
            if (!state.selectedMergeKpis.includes(seq)) state.selectedMergeKpis.push(seq);
          } else {
            state.selectedMergeKpis = state.selectedMergeKpis.filter(item => item !== seq);
          }
          const button = document.querySelector('[data-merge-selected]');
          const count = document.querySelector('[data-merge-count]');
          if (count) count.textContent = state.selectedMergeKpis.length;
          if (button) button.disabled = state.selectedMergeKpis.length < 2;
        });
      });

      document.querySelectorAll('[data-merge-selected]').forEach(el => {
        el.addEventListener('click', () => {
          const empId = state.selectedKpiEmp;
          const month = state.kpiMonth;
          const selectedSet = new Set(state.selectedMergeKpis.map(Number));
          const current = state.kpis.filter(kpi => kpi.empId === empId && kpi.month === month).sort((a, b) => a.seq - b.seq);
          const selected = current.filter(kpi => selectedSet.has(Number(kpi.seq)));
          if (selected.length < 2) { alert('请至少勾选两个考核指标后再合并。'); return; }
          const names = [...new Set(selected.map(kpi => kpi.indicator).filter(Boolean))];
          const defaultName = names.length === 1 ? names[0] : '组合考核指标';
          const groupName = prompt('请输入合并后的考核指标名称：', defaultName);
          if (groupName == null) return;
          if (!groupName.trim()) { alert('合并后的考核指标名称不能为空。'); return; }
          const items = selected.flatMap(childItemsForKpi);
          const merged = {
            indicator: groupName.trim(),
            target: '',
            dataSource: [...new Set(items.map(kpiDataSourceValue).filter(Boolean))].join('、'),
            rule: items.map((item, index) => (index + 1) + '. ' + (item.rule || '')).join('\n'),
            weight: selected.reduce((sum, kpi) => sum + (Number(kpi.weight) || 0), 0),
            items
          };
          const firstSeq = Math.min(...selected.map(kpi => Number(kpi.seq)));
          const ordered = [];
          for (const kpi of current) {
            if (Number(kpi.seq) === firstSeq) ordered.push(merged);
            if (!selectedSet.has(Number(kpi.seq))) ordered.push(kpi);
          }
          replaceEmployeeMonthKpis(empId, month, ordered);
          selected.forEach(kpi => clearKpiDraft(kpi.seq));
          state.selectedMergeKpis = [];
          state.editingKpi = null;
          render();
        });
      });

      document.querySelectorAll('[data-unmerge-kpi]').forEach(el => {
        el.addEventListener('click', () => {
          const seq = Number(el.dataset.unmergeKpi);
          const empId = state.selectedKpiEmp;
          const month = state.kpiMonth;
          const current = state.kpis.filter(kpi => kpi.empId === empId && kpi.month === month).sort((a, b) => a.seq - b.seq);
          const group = current.find(kpi => Number(kpi.seq) === seq);
          if (!group || !Array.isArray(group.items) || !group.items.length) return;
          if (!confirm('确定将“' + group.indicator + '”拆分为 ' + group.items.length + ' 个独立考核指标？')) return;
          const ordered = current.flatMap(kpi => Number(kpi.seq) === seq
            ? group.items.map(item => ({ indicator: item.indicator, target: '', dataSource: kpiDataSourceValue(item), rule: item.rule, weight: Number(item.weight) || 0 }))
            : [kpi]);
          replaceEmployeeMonthKpis(empId, month, ordered);
          state.selectedMergeKpis = [];
          state.editingKpi = null;
          render();
        });
      });

      // Delete KPI
      document.querySelectorAll('[data-del-kpi]').forEach(el => {
        el.addEventListener('click', () => {
          const seq = parseInt(el.dataset.delKpi);
          const curMonth = state.kpiMonth;
          if (!confirm('确定删除该指标？')) return;
          state.kpis = state.kpis.filter(k => !(k.empId === state.selectedKpiEmp && k.seq === seq && k.month === curMonth));
          // Reset evaluation scores since KPI changed
          const ev = state.evals.find(e => e.empId === state.selectedKpiEmp && e.month === curMonth);
          if (ev) {
            ev.selfScore = null;
            ev.mgrScore = null;
            ev.bpScore = null;
            ev.status = "待自评";
          }
          state.editingKpi = null;
          render();
        });
      });

      // Edit KPI
      document.querySelectorAll('[data-edit-kpi]').forEach(el => {
        el.addEventListener('click', () => {
          state.editingKpi = parseInt(el.dataset.editKpi);
          render();
        });
      });

      // Cancel edit
      document.querySelectorAll('[data-cancel-edit]').forEach(el => {
        el.addEventListener('click', () => {
          clearKpiDraft();
          state.editingKpi = null;
          render();
        });
      });

      // Save edit
      document.querySelectorAll('[data-save-edit]').forEach(el => {
        el.addEventListener('click', () => {
          const seq = parseInt(el.dataset.saveEdit);
          const indicator = document.getElementById('edit-indicator').value.trim();
          const dataSource = document.getElementById('edit-source').value.trim();
          const rule = document.getElementById('edit-rule').value.trim();
          const weight = parseInt(document.getElementById('edit-weight').value) || 0;
          if (!indicator) { alert('请填写考核指标名称'); return; }
          if (!rule) { alert('请填写评分细则'); return; }
          const selectedEmployee = state.employees.find(employee => employee.id === state.selectedKpiEmp);
          const allowZeroWeight = selectedEmployee && (
            ['客户运营部', '客服部'].includes(String(selectedEmployee.dept || '').trim()) ||
            /主播|中控/.test(String(selectedEmployee.position || '').trim())
          );
          const minimumWeight = allowZeroWeight ? 0 : 1;
          if (!Number.isInteger(weight) || weight < minimumWeight || weight > 100) {
            alert(allowZeroWeight ? '客服部门、主播岗或中控岗单项权重允许为0%，但必须为0至100的整数，且提交时合计仍须为100%' : '单项权重必须为1至100的整数');
            return;
          }
          const curMonth = state.kpiMonth;
          if (seq === 0) {
            // New KPI
            const empKpis = state.kpis.filter(k => k.empId === state.selectedKpiEmp && k.month === curMonth);
            const maxSeq = empKpis.length > 0 ? Math.max(...empKpis.map(k => k.seq)) : 0;
            state.kpis.push({ empId: state.selectedKpiEmp, seq: maxSeq + 1, indicator, target: '', dataSource, rule, weight, month: curMonth });
          } else {
            const kpi = state.kpis.find(k => k.empId === state.selectedKpiEmp && k.seq === seq && k.month === curMonth);
            if (kpi) {
              kpi.indicator = indicator;
              kpi.target = '';
              kpi.dataSource = dataSource;
              kpi.rule = rule;
              kpi.weight = weight;
            }
          }
          // Reset evaluation scores for this employee in current month since KPI changed
          const ev = state.evals.find(e => e.empId === state.selectedKpiEmp && e.month === curMonth);
          if (ev) {
            ev.selfScore = null;
            ev.mgrScore = null;
            ev.bpScore = null;
            ev.status = "待自评";
          }
          clearKpiDraft(seq);
          state.editingKpi = null;
          render();
        });
      });

      // Invite every eligible employee in the selected assessment month.
      // Existing targets, active workflows and signed archives are preserved
      // and skipped so a bulk action can never overwrite business data.
      document.querySelectorAll('[data-invite-month-targets]').forEach(el => {
        el.addEventListener('click', async () => {
          const month = state.kpiMonth;
          const participants = state.employees.filter(employee => !state.removedEmps.includes(employee.id) && employeeParticipatesInMonth(employee, month));
          const candidates = targetInviteCandidates(month);
          const skipped = participants.length - candidates.length;
          if (!candidates.length) {
            alert(month + '暂无可邀请人员。已有目标、已进入确认流程或已归档的员工不会重复邀请。');
            return;
          }
          if (!confirm('将向' + month + '参与绩效考核且尚无目标的 ' + candidates.length + ' 位员工发送目标填写邀请。\n\n已有目标、确认中或已归档的 ' + skipped + ' 人将自动跳过，不会覆盖原数据。是否继续？')) return;

          try {
            const deliveryResponse = await fetch(SYNC_SERVER_URL + '/delivery-status');
            const deliveryStatus = await deliveryResponse.json();
            if (!deliveryResponse.ok) throw new Error(deliveryStatus.error || '无法检查钉钉通知通道');
            if (!deliveryStatus.ready) throw new Error('当前未配置可用的钉钉通知通道');
          } catch (error) {
            alert('批量邀请未执行：无法使用钉钉通知通道。\n' + error.message);
            return;
          }

          const original = el.textContent;
          el.disabled = true;
          el.textContent = '批量发送中 0/' + candidates.length;
          let cursor = 0;
          let completed = 0;
          const sent = [];
          const failed = [];
          const worker = async () => {
            while (cursor < candidates.length) {
              const emp = candidates[cursor++];
              try {
                const response = await fetch(SYNC_SERVER_URL + '/invite-target-draft', {
                  method: 'POST', headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ empId: emp.id, month, replaceExisting: false, emp: {
                    name: emp.name, realName: emp.realName, dept: emp.dept, position: emp.position,
                    directMgr: emp.directMgr, hrbp: emp.hrbp
                  } })
                });
                const responseText = await response.text();
                let result = {};
                try { result = responseText ? JSON.parse(responseText) : {}; }
                catch (_) { throw new Error(responseText || '服务器返回了无法识别的响应'); }
                if (!response.ok || !result.success) throw new Error(result.error || '发送失败');
                sent.push(emp.name);
              } catch (error) {
                failed.push({ name: emp.name, error: error.message });
              } finally {
                completed += 1;
                el.textContent = '批量发送中 ' + completed + '/' + candidates.length;
              }
            }
          };

          await Promise.all(Array.from({ length: Math.min(4, candidates.length) }, () => worker()));
          try {
            const latestDraftsResponse = await fetch(SYNC_SERVER_URL + '/target-drafts');
            if (latestDraftsResponse.ok) state.targetDrafts = await latestDraftsResponse.json();
          } catch (_) {}

          state.sendStatus = failed.length ? 'error' : 'sent';
          state.sendStatusMsg = month + '目标填写邀请：成功 ' + sent.length + ' 人，失败 ' + failed.length + ' 人，自动跳过 ' + skipped + ' 人。';
          const failureDetail = failed.length ? '\n\n未送达：' + failed.slice(0, 12).map(item => item.name + '（' + item.error + '）').join('、') + (failed.length > 12 ? '等' : '') : '';
          alert('批量邀请完成。\n成功：' + sent.length + '人\n失败：' + failed.length + '人\n跳过：' + skipped + '人' + failureDetail);
          el.textContent = original;
          render();
        });
      });

      // Remind all employees in the selected assessment month at their
      // authoritative target-workflow node.  The server derives the actual
      // recipient for every employee, so this action cannot accidentally send
      // a manager/BP reminder to the wrong role.
      document.querySelectorAll('[data-remind-month-targets]').forEach(el => {
        el.addEventListener('click', async () => {
          const month = state.kpiMonth;
          const candidates = targetReminderCandidates(month);
          if (!candidates.length) {
            alert(month + '暂无需要催办的目标流程。已归档和未进入目标流程的员工会自动跳过。');
            return;
          }
          const stageCounts = candidates.reduce((counts, item) => {
            counts[item.stageLabel] = (counts[item.stageLabel] || 0) + 1;
            return counts;
          }, {});
          const stageSummary = Object.entries(stageCounts).map(([label, count]) => label + ' ' + count + '人').join('、');
          if (!confirm('将按' + month + '每位员工的当前目标节点发送催办，共 ' + candidates.length + ' 人。\n\n' + stageSummary + '\n\n已归档和无待办流程的员工将自动跳过。是否继续？')) return;

          const original = el.textContent;
          el.disabled = true;
          el.textContent = '催办发送中（0/' + candidates.length + '）';
          const sent = [];
          const failed = [];
          for (let index = 0; index < candidates.length; index += 1) {
            const candidate = candidates[index];
            const result = await sendWorkflowReminder(candidate.employee.id, month, 'reminder', { silent: true });
            if (result.success) sent.push({ ...candidate, result });
            else failed.push({ ...candidate, error: result.error || '发送失败' });
            el.textContent = '催办发送中（' + (index + 1) + '/' + candidates.length + '）';
          }

          state.sendStatus = failed.length ? 'error' : 'sent';
          state.sendStatusMsg = month + '目标流程催办：成功 ' + sent.length + ' 人，失败 ' + failed.length + ' 人。节点分布：' + stageSummary + '。';
          const failureDetail = failed.length
            ? '\n\n未送达：' + failed.slice(0, 12).map(item => item.employee.name + '（' + item.stageLabel + '：' + item.error + '）').join('、') + (failed.length > 12 ? '等' : '')
            : '';
          alert('一键催办完成。\n成功：' + sent.length + '人\n失败：' + failed.length + '人\n\n节点分布：' + stageSummary + failureDetail);
          el.textContent = original;
          render();
        });
      });

      document.querySelectorAll('[data-request-target-adjustment]').forEach(el => {
        el.addEventListener('click', async () => {
          const empId = el.dataset.requestTargetAdjustment;
          const emp = state.employees.find(item => item.id === empId);
          if (!emp) return alert('未找到员工资料，请刷新后重试。');
          if (!confirm('确定向“' + emp.name + '”发起' + state.kpiMonth + '绩效目标调整申请吗？\n\n员工将在已归档目标基础上调整，随后依次由直属上级、BP审核，通过后员工需重新签字归档。')) return;
          const original = el.textContent;
          el.disabled = true;
          el.textContent = '发起中…';
          try {
            const response = await fetch(SYNC_SERVER_URL + '/request-target-adjustment', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ empId, month: state.kpiMonth })
            });
            const result = await response.json();
            if (!response.ok || !result.success) throw new Error(result.error || '发起失败');
            state.targetDrafts[assessmentKey(empId, state.kpiMonth)] = result.record;
            alert('目标调整申请已发起并通知员工。' + (result.warning ? '\n\n提示：' + result.warning : ''));
            render();
          } catch (error) {
            alert('目标调整申请发起失败：' + error.message);
            el.disabled = false;
            el.textContent = original;
          }
        });
      });

      // Invite the selected employee to fill in their own KPI targets. The
      // submitted draft becomes official only after manager and BP approval.
      document.querySelectorAll('[data-invite-target-draft]').forEach(el => {
        el.addEventListener('click', async () => {
          const empId = el.dataset.inviteTargetDraft;
          const emp = state.employees.find(item => item.id === empId);
          if (!emp) {
            alert('员工资料尚未同步，请刷新通讯录后重试。');
            return;
          }
          const hasLocalKpis = el.dataset.hasLocalKpis === '1';
          const replaceExisting = el.dataset.replaceExistingTarget === '1';
          if (!confirm('向“' + emp.name + '”发送' + state.kpiMonth + '绩效目标' + (replaceExisting ? '重新填写' : '填写') + '邀请？\n员工提交后先由直属上级确认，再由BP确认；两级确认通过后员工还需完成目标签字归档，之后由管理员手动发送自评。' + (replaceExisting ? '\n\n系统会把当前旧版目标作为员工填写的初始内容，原数据不会丢失。' : (hasLocalKpis ? '\n\n当前未提交的后台填写草稿将由员工填报内容替代。' : '')))) return;
          const original = el.textContent;
          el.disabled = true;
          el.textContent = '发送中…';
          try {
            const response = await fetch(SYNC_SERVER_URL + '/invite-target-draft', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ empId, month: state.kpiMonth, replaceExisting, emp: {
                name: emp.name, realName: emp.realName, dept: emp.dept, position: emp.position,
                directMgr: emp.directMgr, hrbp: emp.hrbp
              } })
            });
            const responseText = await response.text();
            let result = {};
            try { result = responseText ? JSON.parse(responseText) : {}; }
            catch (_) { throw new Error(responseText || '服务器返回了无法识别的响应'); }
            if (!response.ok || !result.success) throw new Error(result.error || '发送失败');
            state.targetDrafts[assessmentKey(empId, state.kpiMonth)] = {
              empId, month: state.kpiMonth, emp, status: result.status || 'invited', invitedAt: new Date().toISOString()
            };
            if (hasLocalKpis && !replaceExisting) state.kpis = state.kpis.filter(kpi => !(kpi.empId === empId && kpi.month === state.kpiMonth));
            alert((replaceExisting ? '重新填写' : '填写') + '邀请已发送给“' + emp.name + '”。');
            render();
          } catch (error) {
            alert('目标填写邀请发送失败：' + error.message);
            el.disabled = false;
            el.textContent = original;
          }
        });
      });

      // Submit KPI - open modal
      document.querySelectorAll('[data-submit-kpi]').forEach(el => {
        el.addEventListener('click', () => {
          state.showSubmitModal = true;
          state.selectedSubmitEmps = []; // reset to trigger default (all ready)
          render();
        });
      });

      // Close modal
      document.querySelectorAll('[data-close-modal]').forEach(el => {
        el.addEventListener('click', () => {
          state.showSubmitModal = false;
          state.selectedSubmitEmps = [];
          render();
        });
      });

      // Modal overlay click (outside box)
      document.querySelectorAll('[data-modal-overlay]').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target === el) {
            state.showSubmitModal = false;
            state.selectedSubmitEmps = [];
            render();
          }
        });
      });

      // Individual employee checkbox
      document.querySelectorAll('[data-select-emp]').forEach(el => {
        el.addEventListener('change', () => {
          const empId = el.dataset.selectEmp;
          if (el.checked) {
            if (!state.selectedSubmitEmps.includes(empId)) state.selectedSubmitEmps.push(empId);
          } else {
            state.selectedSubmitEmps = state.selectedSubmitEmps.filter(id => id !== empId);
          }
          render();
        });
      });

      // Toggle all checkbox
      document.querySelectorAll('[data-toggle-all]').forEach(el => {
        el.addEventListener('change', () => {
          const curMonth = state.kpiMonth;
          const monthKpis = state.kpis.filter(k => k.month === curMonth);
          const readyEmpIds = [...new Set(monthKpis.map(k => k.empId))].filter(eid => {
            const empKpis = monthKpis.filter(k => k.empId === eid);
            return !isKpiSubmissionLocked(eid, curMonth) && !hasActiveTargetWorkflow(eid, curMonth) && empKpis.reduce((s, k) => s + k.weight, 0) === 100;
          });
          if (el.checked) {
            state.selectedSubmitEmps = readyEmpIds;
          } else {
            state.selectedSubmitEmps = [];
          }
          render();
        });
      });

      // Confirm submit - prepare DingTalk messages and copy to clipboard
      document.querySelectorAll('[data-confirm-submit]').forEach(el => {
        el.addEventListener('click', async () => {
          const curMonth = state.kpiMonth;
          const monthKpis = state.kpis.filter(k => k.month === curMonth);

          // Only submit selected employees that are also ready (weight === 100)
          const selectedEmps = state.selectedSubmitEmps.filter(eid => {
            if (isKpiSubmissionLocked(eid, curMonth) || hasActiveTargetWorkflow(eid, curMonth)) return false;
            const empKpis = monthKpis.filter(k => k.empId === eid);
            return empKpis.reduce((s, k) => s + k.weight, 0) === 100;
          });

          if (selectedEmps.length === 0) {
            alert('没有选中的员工或选中员工权重未达标，请先调整KPI权重至100%');
            return;
          }

          try {
            const deliveryResponse = await fetch(SYNC_SERVER_URL + '/delivery-status');
            const deliveryStatus = await deliveryResponse.json();
            if (!deliveryResponse.ok) {

              return { empId: eid, emp: { name: emp.name, realName: emp.realName, dept: emp.dept, position: emp.position, directMgr: emp.directMgr, hrbp: emp.hrbp }, kpis: empKpis, month: curMonth };

        let source = String(doc || '');

          source = source.replace(/&quot;/g, '');

          source = source.replace(/(<th[^>]*>)\s*目标值\s*(<\/th>)/, '$1评分细则$2');
          source = source.replace(/<div>\s*--\s*<\/div>/g, '');
          source = source.replace(/<div[^>]*>\s*目标：\s*--\s*<\/div>/g, '');
        }
        const kpiColumns = type === 'kpi'
          ? 'thead th:nth-child(2),tbody td:nth-child(2){width:180px!important}thead th:nth-child(3),tbody td:nth-child(3){width:auto!important}thead th:nth-child(4),tbody td:nth-child(4){width:180px!important}tbody td:nth-child(4)>div{white-space:normal!important;word-break:break-word!important;line-height:1.55!important;text-align:left!important}thead th:nth-child(5),tbody td:nth-child(5){width:76px!important;text-align:center!important}'
          : '';
        const previewStyle = `<style id="archive-wide-preview">
          html{background:#eef2f7}
          body{max-width:1120px!important;width:auto!important;padding:16px!important;margin:0 auto!important;background:#fff}
          table{width:100%!important;min-width:960px!important;table-layout:fixed!important}

          thead th:first-child,tbody td:first-child{width:52px!important;text-align:center!important}
          thead th:last-child,tbody td:last-child{width:76px!important;text-align:center!important}
          ${kpiColumns}
          .archive-sealed-banner{max-width:1120px;margin:0 auto 14px;padding:10px 14px;border:1px solid ${accent};border-radius:9px;background:#f8fafc;color:${accent};font:600 13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
          @media(max-width:760px){body{padding:10px!important;overflow-x:auto}table{min-width:900px!important}}
        </style>`;
        const banner = `<div class="archive-sealed-banner">已签署归档·当前文档已封存，仅供查看，不可重复提交</div>`;
        let preview = source.includes('</head>') ? source.replace('</head>', previewStyle + '</head>') : previewStyle + source;
