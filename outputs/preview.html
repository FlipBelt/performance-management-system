<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>绩效管理系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f9fafb; color: #111827; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .header { background: white; border-bottom: 1px solid #e5e7eb; padding: 16px 24px; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 36px; height: 36px; background: #2563eb; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; }
    .logo-text h1 { font-size: 18px; font-weight: 700; color: #111827; }
    .logo-text p { font-size: 12px; color: #6b7280; }
    .tabs { background: white; border-bottom: 1px solid #e5e7eb; padding: 0 24px; }
    .tabs-inner { display: flex; gap: 4px; max-width: 1200px; margin: 0 auto; overflow-x: auto; }
    .tab { padding: 12px 16px; font: inherit; font-size: 14px; font-weight: 500; color: #6b7280; border: 0; border-bottom: 2px solid transparent; background: transparent; cursor: pointer; white-space: nowrap; transition: color .15s ease,border-color .15s ease; }
    .tab:hover { color: #374151; }
    .tab.active { color: #2563eb; border-bottom-color: #2563eb; }
    .card { background: white; border-radius: 12px; border: 1px solid #e5e7eb; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .card-header { padding: 16px 20px; border-bottom: 1px solid #e5e7eb; background: #f9fafb; }
    .card-body { padding: 20px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .grid-6 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
    .grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .stat-card { padding: 20px; display: flex; align-items: center; gap: 12px; }
    .stat-icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .stat-value { font-size: 24px; font-weight: 700; color: #111827; }
    .stat-label { font-size: 12px; color: #6b7280; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 12px 16px; text-align: left; font-size: 13px; font-weight: 500; color: #4b5563; background: #f9fafb; border-bottom: 1px solid #e5e7eb; }
    td { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid #f3f4f6; }
    tr:hover td { background: #f9fafb; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 9999px; font-size: 12px; font-weight: 500; }
    .badge-green { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .badge-red { background: #fff1f2; color: #b42318; border: 1px solid #fecdd3; }
    .alert-error { padding: 10px 12px; border: 1px solid #fecaca; border-radius: 9px; background: #fff7f7; color: #b42318; }
    .badge-blue { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .badge-purple { background: #f5f3ff; color: #6d28d9; border: 1px solid #ddd6fe; }
    .badge-amber { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .badge-cyan { background: #ecfeff; color: #0e7490; border: 1px solid #a5f3fc; }
    .badge-gray { background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; }
    .grade-a { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
    .grade-bp { background: #eff6ff; color: #0284c7; border: 1px solid #bfdbfe; }
    .grade-b { background: #f5f3ff; color: #7c3aed; border: 1px solid #ddd6fe; }
    .grade-bm { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
    .grade-c { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: color .15s ease,background-color .15s ease,border-color .15s ease,opacity .15s ease; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: white; color: #374151; border: 1px solid #d1d5db; }
    .btn-secondary:hover { background: #f9fafb; }
    .btn-sm { padding: 4px 12px; font-size: 12px; }
    .progress-bar { height: 10px; background: #f3f4f6; border-radius: 9999px; overflow: hidden; flex: 1; }
    .progress-fill { height: 100%; border-radius: 9999px; transition: width 0.5s; }
    .kpi-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 12px; transition: border-color .15s ease,background-color .15s ease; }
    .kpi-card:hover { border-color: #d1d5db; }
    .kpi-card.editing { border-color: #93c5fd; background: #eff6ff; }
    .kpi-num { width: 32px; height: 32px; background: #dbeafe; color: #1d4ed8; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
    .input { padding: 6px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; transition: border-color .15s ease,box-shadow .15s ease; }
    .input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    .input-sm { padding: 4px 8px; font-size: 13px; width: 80px; text-align: center; }
    .text-xs { font-size: 12px; }
    .text-sm { font-size: 14px; }
    .font-medium { font-weight: 500; }
    .font-bold { font-weight: 700; }
    .text-gray-500 { color: #6b7280; }
    .text-gray-600 { color: #4b5563; }
    .text-gray-900 { color: #111827; }
    .text-blue-600 { color: #2563eb; }
    .text-green-600 { color: #059669; }
    .text-amber-600 { color: #d97706; }
    .text-red-600 { color: #dc2626; }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mt-4 { margin-top: 16px; }
    .mb-3 { margin-bottom: 12px; }
    .mb-4 { margin-bottom: 16px; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    .space-y-2 > * + * { margin-top: 8px; }
    .space-y-3 > * + * { margin-top: 12px; }
    .space-y-4 > * + * { margin-top: 16px; }
    .space-y-6 > * + * { margin-top: 24px; }
    .w-16 { width: 64px; }
    .w-28 { width: 112px; }
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .hidden { display: none; }
    .alert { padding: 16px 20px; border-radius: 8px; border: 1px solid; }
    .alert-amber { background: #fffbeb; border-color: #fde68a; color: #92400e; }
    .alert-blue { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
    .medal { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
    .medal-1 { background: #facc15; color: white; }
    .medal-2 { background: #d1d5db; color: white; }
    .medal-3 { background: #d97706; color: white; }
    .medal-other { background: #f3f4f6; color: #4b5563; }
    .emp-btn { padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid #e5e7eb; background: white; color: #4b5563; transition: color .15s ease,background-color .15s ease,border-color .15s ease; }
    .emp-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
    .emp-btn:hover:not(.active) { background: #f9fafb; }
    .score-input { width: 80px; padding: 4px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; text-align: center; outline: none; }
    .score-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    .close-btn { width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent; color: #9ca3af; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .close-btn:hover { background: #f3f4f6; color: #4b5563; }
    .del-btn { width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent; color: #fca5a5; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .del-btn:hover { background: #fef2f2; color: #dc2626; }
    .weight-warn { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .modal-box { background: white; border-radius: 16px; width: 90%; max-width: 700px; max-height: 80vh; overflow: auto; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .modal-box h2 { font-size: 18px; font-weight: 600; color: #111827; margin: 0 0 6px 0; }
    .modal-box .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
    .submit-emp-card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .submit-emp-card.ready { border-color: #86efac; background: #f0fdf4; }
    .submit-emp-card.not-ready { border-color: #fecaca; background: #fef2f2; }
    .submit-kpi-item { font-size: 13px; color: #4b5563; padding: 4px 0; border-bottom: 1px dashed #f3f4f6; }
    .submit-kpi-item:last-child { border-bottom: none; }
    .btn-send { background: #059669; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .btn-send:hover { background: #047857; }
    .btn-send:disabled { background: #d1d5db; cursor: not-allowed; }
    .send-status { font-size: 12px; padding: 4px 10px; border-radius: 6px; font-weight: 500; }
    .send-status.sent { background: #dcfce7; color: #166534; }
    .send-status.pending { background: #fef9c3; color: #854d0e; }
    .send-status.failed { background: #fef2f2; color: #991b1b; }
    .grade-guide-grid { display: grid; grid-template-columns: 52px minmax(72px, 1fr) 184px 64px; align-items: center; gap: 10px; }
    .grade-guide-header { padding: 0 10px 7px; color: #9ca3af; font-size: 11px; font-weight: 600; border-bottom: 1px solid #eef2f7; }
    .grade-guide-row { min-height: 38px; padding: 6px 10px; border-bottom: 1px solid #f3f4f6; border-radius: 7px; transition: background .15s ease; }
    .grade-guide-row:last-child { border-bottom: none; }
    .grade-guide-row:hover { background: #f8fafc; }
    .grade-guide-range { color: #64748b; font-size: 12px; text-align: right; white-space: nowrap; }
    .grade-guide-coeff { justify-self: end; min-width: 48px; padding: 3px 7px; border-radius: 999px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 600; text-align: center; }
    @media (max-width: 640px) {
      .grade-guide-grid { grid-template-columns: 52px minmax(90px, 1fr) 64px; gap: 8px; }
      .grade-guide-header .grade-guide-range { display: none; }
      .grade-guide-row .grade-guide-range { grid-column: 2 / 4; grid-row: 2; text-align: left; white-space: normal; padding-top: 1px; }
      .grade-guide-coeff { grid-column: 3; grid-row: 1; }
    }
    .manager-picker-list { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:360px;overflow:auto;margin-top:12px; }
    .manager-picker-item { text-align:left;padding:10px 12px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer; }
    .manager-picker-item:hover,.manager-picker-item:focus { border-color:#93c5fd;background:#eff6ff;outline:none; }
    .kpi-workspace { display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start; }
    .kpi-person-panel { position:sticky;top:12px;padding:12px;max-height:calc(100vh - 120px);overflow:auto; }
    .kpi-person-list { display:grid;gap:6px;margin-top:10px; }
    .kpi-person-list .emp-btn { width:100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    @media (max-width: 1024px) {
      .container { padding:16px; }
      .header-inner { gap:16px; }
      .grid-4,.grid-5,.grid-6 { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .tabs-inner { flex-wrap:nowrap; }
      .tab { flex:0 0 auto; }
      .card:has(> table),.card:has(.card-body > table) { overflow-x:auto!important; }
      .card > table,.card-body > table { min-width:760px; }
      .kpi-workspace { grid-template-columns:190px minmax(0,1fr); }
    }
    @media (max-width: 640px) {
      html,body { max-width:100%;overflow-x:hidden; }
      .container { padding:10px; }
      .header { padding:12px; }
      .header-inner { align-items:flex-start; }
      .header-inner > .flex { flex-direction:column;align-items:flex-end;gap:6px; }
      .logo-text p,.header-inner > .flex > span { display:none; }
      .tabs { padding:0 8px; }
      .tab { padding:11px 13px; }
      .grid-2,.grid-4,.grid-5,.grid-6 { grid-template-columns:1fr; }
      .card-body { padding:14px; }
      .modal-overlay { align-items:flex-end; }
      .modal-box { width:100%;max-width:none;max-height:92vh;border-radius:16px 16px 0 0;padding:20px 14px; }
      .manager-picker-list { grid-template-columns:1fr; }
      .kpi-workspace { grid-template-columns:1fr; }
      .kpi-person-panel { position:static;max-height:none; }
      .kpi-person-list { display:flex;overflow-x:auto;padding-bottom:4px; }
      .kpi-person-list .emp-btn { width:auto;min-width:max-content; }
      .flex-wrap { flex-wrap:wrap; }
    }
    /* ===== 2026 application-shell visual refresh ===== */
    :root {
      --brand-950:#103f3a;
      --brand-900:#15534c;
      --brand-800:#1d665d;
      --lime-300:#cceb82;
      --lime-200:#dff3aa;
      --lime-100:#eff8d7;
      --canvas:#f3f4ee;
      --surface:#ffffff;
      --surface-soft:#f8f8f4;
      --ink:#17211f;
      --muted:#6f7a76;
      --line:#e2e6df;
      --shadow:0 12px 34px rgba(28,53,47,.07);
    }
    body { background:var(--canvas);color:var(--ink);letter-spacing:-.01em; }
    #app { min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:76px minmax(0,1fr); }
    .header { grid-column:1 / 3;grid-row:1;background:rgba(250,251,247,.94);border-bottom:1px solid var(--line);padding:0 22px;position:sticky;top:0;z-index:120;backdrop-filter:blur(14px); }
    .header-inner { height:76px;max-width:none;margin:0;justify-content:flex-start;gap:28px; }
    .logo { width:194px;flex:0 0 194px;gap:10px; }
    .logo-icon { width:38px;height:38px;background:var(--brand-900);border-radius:12px;font-size:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16); }
    .logo-icon::before { content:"FT";font-size:13px;font-weight:800;letter-spacing:-.04em;color:#fff; }
    .logo-text h1 { color:var(--brand-950);font-size:17px;letter-spacing:-.03em; }
    .logo-text p { color:#81908b;font-size:11px;margin-top:2px; }
    .header-search { flex:1;max-width:460px;height:42px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 1px rgba(20,40,35,.02); }
    .header-search:focus-within { border-color:#99b8ae;box-shadow:0 0 0 3px rgba(21,83,76,.08); }
    .header-search-icon { color:#71807b;font-size:18px;line-height:1; }
    .header-search input { width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:13px; }
    .header-search kbd { padding:2px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface-soft);color:#82908b;font:600 10px/1.4 inherit;white-space:nowrap; }
    .header-actions { margin-left:auto;display:flex;align-items:center;gap:10px; }
    .icon-button { width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--brand-900);display:grid;place-items:center;cursor:pointer;font-size:15px; }
    .icon-button:hover { background:var(--lime-100);border-color:#d1e8a0; }
    .user-chip { display:flex;align-items:center;gap:10px;padding:5px 10px 5px 5px;border-radius:14px; }
    .user-avatar { width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,var(--brand-800),var(--brand-950));color:#fff;font-weight:800;font-size:12px; }
    .user-copy { line-height:1.25;white-space:nowrap; }
    .user-copy strong { display:block;font-size:12px;color:var(--ink); }
    .user-copy span { display:block;font-size:10px;color:var(--muted);margin-top:2px; }
    .tabs { grid-column:1;grid-row:2;display:flex;flex-direction:column;min-width:0;background:#f8f9f4;border:0;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:76px;height:calc(100vh - 76px);z-index:90; }
    .sidebar-workspace { padding:10px 12px 16px;margin-bottom:8px;border-bottom:1px solid var(--line); }
    .sidebar-workspace-label { display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--ink); }
    .sidebar-workspace-mark { width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#fff;border:1px solid var(--line);color:var(--brand-900); }
    .sidebar-workspace small { display:block;margin:4px 0 0 40px;color:var(--muted);font-size:10px;font-weight:500; }
    .sidebar-section-label { padding:10px 12px 6px;color:#98a19d;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase; }
    .tabs-inner { width:100%;max-width:none;margin:0;display:flex;flex-direction:column;gap:5px;overflow:visible; }
    .tab { width:100%;display:flex;align-items:center;gap:11px;padding:11px 13px;border:0;border-radius:11px;color:#596661;font-size:13px;font-weight:650;text-align:left;transition:background-color .15s ease,color .15s ease,transform .15s ease; }
    .tab:hover { background:#eef1e9;color:var(--brand-950); }
    .tab.active { background:var(--lime-300);color:var(--brand-950);border:0;box-shadow:inset 0 0 0 1px rgba(81,112,38,.06); }
    .tab-icon { width:22px;height:22px;display:grid;place-items:center;border-radius:7px;font-size:15px;color:currentColor; }
    .tab-label { flex:1; }
    .tab-indicator { width:6px;height:6px;border-radius:50%;background:var(--brand-900);opacity:0; }
    .tab.active .tab-indicator { opacity:1; }
    .sidebar-footer { margin-top:auto;padding:12px;border-top:1px solid var(--line); }
    .sidebar-footer strong { display:block;color:var(--ink);font-size:12px; }
    .sidebar-footer span { display:block;color:var(--muted);font-size:10px;margin-top:3px; }
    .container { grid-column:2;grid-row:2;width:100%;max-width:1540px;margin:0 auto;padding:28px 32px 44px;min-width:0; }
    .page-heading { display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px; }
    .page-eyebrow { color:var(--brand-800);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px; }
    .page-heading h2 { color:var(--ink);font-size:27px;line-height:1.15;letter-spacing:-.045em; }
    .page-heading p { color:var(--muted);font-size:13px;margin-top:7px; }
    .month-chip { flex:0 0 auto;padding:8px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--brand-900);font-size:12px;font-weight:700; }
    .card { border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow); }
    .card-header { padding:17px 20px;background:var(--surface-soft);border-bottom:1px solid var(--line);border-radius:16px 16px 0 0; }
    .card-body { padding:20px; }
    .stat-card { position:relative;min-height:112px;padding:18px 19px;align-items:flex-start;border-radius:16px;overflow:hidden; }
    .stat-card::after { content:"";position:absolute;width:68px;height:68px;right:-20px;bottom:-24px;border-radius:50%;background:var(--lime-100); }
    .stat-icon { width:38px;height:38px;border-radius:11px;background:var(--lime-100)!important;color:var(--brand-900)!important;font-size:16px; }
    .stat-value { color:var(--brand-950);font-size:25px;line-height:1.1;letter-spacing:-.04em; }
    .stat-label { color:var(--muted);font-size:11px;margin-top:5px; }
    th { padding:12px 15px;color:#65716d;background:#f5f6f1;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap; }
    td { padding:13px 15px;border-bottom:1px solid #edf0ea;color:#34413d;font-size:13px; }

      const current = now.getFullYear() * 12 + now.getMonth();
      const known = [...state.kpis.map(item => item.month), ...state.evals.map(item => item.month)].map(month => {
        const match = String(month || '').match(/(\d{4})年(\d{1,2})月/);
        return match ? Number(match[1]) * 12 + Number(match[2]) - 1 : start;
      });
      const end = Math.max(current + 12, start, ...known);
      return Array.from({ length: end - start + 1 }, (_, index) => {
        const order = start + index;
        return `${Math.floor(order / 12)}年${order % 12 + 1}月`;
      });
    }

    function assessmentMonthOrder(month) {

      const start = assessmentMonthOrder(employee.assessmentStartMonth);

      return (start === null || target >= start) && (inactive === null || target < inactive);

    }

    function hasAuthorizedTargets(empId, month) {
      return ARCHIVES.some(record => record.empId === empId && record.doc && archiveMatchesMonth(record, month));
    }

    function ensureEvaluationsForSignedTargets() {
      let changed = false;
      ARCHIVES.forEach(record => {
        const empId = String(record && record.empId || '').trim();
        const month = String(record && record.month || '').trim();
        if (!empId || !month || !record.doc || !archiveMatchesMonth(record, month)) return;
        if (state.evals.some(evaluation => evaluation.empId === empId && evaluation.month === month)) return;
        const employee = state.employees.find(item => item.id === empId);
        state.evals.push({
          empId, month, selfScore: null, mgrScore: null, bpScore: null,
          status: '待自评', directMgr: employee ? employee.directMgr : ''
        });
        changed = true;
      });
      return changed;
    }

    function isValidScore(value, maximum = MAX_TOTAL_SCORE) {
      const score = Number(value);
      return Number.isFinite(score) && score >= 0 && score <= maximum;
    }

    function isValidEvaluation(evaluation) {
      if (!evaluation) return false;
      return ['selfScore', 'mgrScore', 'bpScore'].every(field => evaluation[field] == null || isValidScore(evaluation[field]));
    }

    const evaluationIdentityCache = new Map();

    function rememberEvaluationIdentity(record) {
      if (!record || !record.empId || !record.month) return false;
      const key = assessmentKey(record.empId, record.month);
      const previous = evaluationIdentityCache.get(key) || {};
      const next = { ...previous };
      for (const field of ['name', 'realName', 'dept', 'position', 'directMgr', 'hrbp']) {
        const value = String(record[field] || '').trim();
        if (value) next[field] = value;
      }
      evaluationIdentityCache.set(key, next);
      return JSON.stringify(previous) !== JSON.stringify(next);
    }

    function employeeForEvaluation(evaluation) {
      if (!evaluation) return null;
      const direct = state.employees.find(employee => employee.id === evaluation.empId);
      const key = assessmentKey(evaluation.empId, evaluation.month);
      const serverIdentity = SERVER_EMPLOYEE_IDENTITIES[evaluation.empId];
      const meaningful = value => {
        const normalized = String(value == null ? '' : value).trim().toLowerCase();
        return normalized && normalized !== 'undefined' && normalized !== 'null' && !['未知员工', '未匹配部门', '未匹配岗位'].includes(normalized);
      };
      if (direct && serverIdentity) {
        const resolved = { ...serverIdentity, id: evaluation.empId };
        for (const field of ['name', 'realName', 'dept', 'position', 'directMgr', 'hrbp']) {
          if (meaningful(direct[field])) resolved[field] = direct[field];
        }
        return resolved;
      }
      if (direct && meaningful(direct.name)) return direct;
      const draft = state.targetDrafts && state.targetDrafts[key];
      const archive = ARCHIVES.find(record => record.empId === evaluation.empId && (!evaluation.month || !record.month || record.month === evaluation.month));
      const identities = [evaluation, serverIdentity, evaluationIdentityCache.get(key), draft && draft.emp, archive, archive && archive.emp].filter(Boolean);
      for (const identity of identities) {
        const name = String(identity.name || identity.nick || '').trim();
        const realName = String(identity.realName || '').trim();
        const matched = state.employees.find(employee =>
          (name && employee.name === name) || (realName && employee.realName === realName)
        );
        if (matched) return matched;
      }
      const identity = identities.find(item => item.name || item.nick || item.realName) || evaluation;
      return {
        id: evaluation.empId,
        name: String(identity.name || identity.nick || '未知员工'),
        realName: String(identity.realName || ''),
        dept: String(identity.dept || identity.department || '未匹配部门'),
        position: String(identity.position || identity.title || '未匹配岗位'),
        directMgr: String(identity.directMgr || evaluation.directMgr || ''),
        hrbp: organizationHrbpFor(identity.name || identity.nick, identity.dept || identity.department, identity.hrbp)
      };
    }

    function evaluationParticipatesInAssessmentMonth(evaluation) {
      if (!evaluation) return false;
      const employee = employeeForEvaluation(evaluation);
      return !employee || employeeParticipatesInMonth(employee, evaluation.month);
    }

    function enrichEvaluationIdentity(evaluation, serverRecord) {
      if (!evaluation || !serverRecord) return false;
      let changed = false;
      for (const field of ['name', 'realName', 'dept', 'position', 'directMgr', 'hrbp']) {
        const value = String(serverRecord[field] || '').trim();
        if (value && evaluation[field] !== value) {
          evaluation[field] = value;
          changed = true;
        }
      }
      return changed;
    }

    function isValidServerAssessment(data, detailField, totalField) {
      if (!data || !isValidScore(data[totalField])) return false;
      const details = Array.isArray(data[detailField]) ? data[detailField] : [];
      return details.every(detail => {
        const score = Number(detail.score);
        const maximum = Number(detail.max || 0);
        // 子考核项允许相互调剂，不单独设置 120% 上限；仅要求非负，
        // 总分仍由上面的 isValidScore 统一限制在 0-120 分。
        return maximum > 0 && Number.isFinite(score) && score >= 0;
      });
    }

    function kpiDraftKey(seq = state.editingKpi) {
      return [state.selectedKpiEmp || '', state.kpiMonth || '', Number(seq) || 0].join('|');
    }

    function getKpiDraft(seq, fallback = {}) {
      const draft = state.kpiDrafts[kpiDraftKey(seq)];
      return draft ? { ...fallback, ...draft } : { ...fallback };
    }

    function saveKpiDraftFromEditor() {
      if (state.editingKpi == null) return;
      const indicator = document.getElementById('edit-indicator');
      const dataSource = document.getElementById('edit-source');
      const rule = document.getElementById('edit-rule');
      const weight = document.getElementById('edit-weight');
      if (!indicator || !dataSource || !rule || !weight) return;
      state.kpiDrafts[kpiDraftKey()] = {
        indicator: indicator.value,
        target: '',
        dataSource: dataSource.value,
        rule: rule.value,
        weight: weight.value,
        updatedAt: new Date().toISOString()
      };
      try { localStorage.setItem('perf_kpiDrafts', JSON.stringify(state.kpiDrafts)); } catch (_) {}
      const status = document.getElementById('kpi-draft-status');
      if (status) status.textContent = '草稿已自动保存 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
    }

    function clearKpiDraft(seq = state.editingKpi) {
      delete state.kpiDrafts[kpiDraftKey(seq)];
      try { localStorage.setItem('perf_kpiDrafts', JSON.stringify(state.kpiDrafts)); } catch (_) {}
    }

    function hasActiveKpiEditor() {
      return state.editingKpi != null && Boolean(document.getElementById('edit-indicator'));
    }

    function renderAfterBackgroundSync(changed = true) {
      if (!changed) return;
      if (hasActiveKpiEditor()) {
        saveKpiDraftFromEditor();
        return;
      }
      render();
    }

    function childItemsForKpi(kpi) {
      if (Array.isArray(kpi?.items) && kpi.items.length) return kpi.items.map(item => ({ ...item, target: '', dataSource: kpiDataSourceValue(item) }));
      return [{ indicator: kpi?.indicator || '', target: '', dataSource: kpiDataSourceValue(kpi), rule: kpi?.rule || '', weight: Number(kpi?.weight) || 0 }];
    }

    function isManagerScoreSource(value) {
      return /^(?:直属)?上级(?:打分|评分)$/.test(String(value || '').trim());
    }

    function kpiDataSourceValue(kpi) {
      const explicit = String(kpi?.dataSource || kpi?.source || '').trim();
      if (explicit) {
        const cleaned = explicit.replace(/^["'“”]+|["'“”]+$/g, '').trim()
          .replace(/^目标值\s*[:：][\s\S]*?数据来源\s*[:：]\s*/i, '').trim();
        return isManagerScoreSource(cleaned) ? '上级评分' : cleaned;
      }
      return isManagerScoreSource(kpi?.target) ? '上级评分' : '';
    }

    function normalizeServerTargetKpis(empId, month, targetInfo) {
      return (Array.isArray(targetInfo?.kpis) ? targetInfo.kpis : []).map((kpi, index) => ({
        empId, month, seq: Number(kpi.seq) || index + 1,
        indicator: String(kpi.indicator || ''), target: '', dataSource: kpiDataSourceValue(kpi),
        rule: String(kpi.rule || ''), weight: Number(kpi.weight) || 0,
        items: Array.isArray(kpi.items) ? kpi.items.map(item => ({
          indicator: String(item.indicator || ''), target: '', dataSource: kpiDataSourceValue(item),
          rule: String(item.rule || ''), weight: Number(item.weight) || 0
        })) : []
      }));
    }

    function reconcileServerTargets(kpiTargetData) {
      let changed = false;
      for (const [key, targetInfo] of Object.entries(kpiTargetData || {})) {
        if (!targetInfo || !Array.isArray(targetInfo.kpis) || !targetInfo.kpis.length) continue;
        const separator = key.indexOf('|');
        const empId = String(targetInfo.empId || (separator >= 0 ? key.slice(0, separator) : '')).trim();
        const month = String(targetInfo.month || (separator >= 0 ? key.slice(separator + 1) : '')).trim();
        if (!empId || !month) continue;
        const next = normalizeServerTargetKpis(empId, month, targetInfo);
        const current = state.kpis.filter(kpi => kpi.empId === empId && kpi.month === month)
          .sort((a, b) => Number(a.seq) - Number(b.seq));
        if (JSON.stringify(current) === JSON.stringify(next)) continue;
        state.kpis = state.kpis.filter(kpi => !(kpi.empId === empId && kpi.month === month));
        state.kpis.push(...next);
        changed = true;
      }
      return changed;
    }

    function kpiTargetValue(kpi) {
      const target = String(kpi?.target || '').trim();
      return isManagerScoreSource(target) ? '' : target;
    }

    function archiveMatchesMonth(record, month) {
      if (!record) return false;
      const archiveMonth = String(record.month || '').trim();
      const selectedMonth = String(month || '').trim();
      return !archiveMonth || !selectedMonth || archiveMonth === selectedMonth;
    }

    function isKpiSubmissionLocked(empId, month) {
      const targetArchive = ARCHIVES.find(record => record.empId === empId && record.doc && archiveMatchesMonth(record, month));
      const resultArchive = validResultArchiveFor(empId, month);
      return Boolean(targetArchive || (resultArchive && resultArchive.doc && archiveMatchesMonth(resultArchive, month)));
    }

    function hasActiveTargetWorkflow(empId, month) {
      const key = assessmentKey(empId, month);
      const draft = state.targetDrafts[key];
      const rejectedAdminDraft = draft && draft.source === 'admin-entry' && draft.status === 'rejected';
      return state.submittedTargetKeys.includes(key) || Boolean(draft && !rejectedAdminDraft);
    }

    function selfEvaluationNoticeWasSent(empId, month) {
      const draft = state.targetDrafts[assessmentKey(empId, month)];
      if (!draft) return false;
      const delivery = draft.selfEvaluationDelivery || {};
      return Boolean(
        draft.selfEvaluationSentAt ||
        delivery.sent ||
        delivery.sentAt ||
        delivery.deliveredAt
      );
    }

    function resetEvaluationAfterKpiChange(empId, month) {
      const evaluation = state.evals.find(item => item.empId === empId && item.month === month);
      if (!evaluation) return;
      evaluation.selfScore = null;
      evaluation.mgrScore = null;
      evaluation.bpScore = null;
      evaluation.status = '待自评';
    }

    function replaceEmployeeMonthKpis(empId, month, orderedKpis) {
      state.kpis = state.kpis.filter(kpi => !(kpi.empId === empId && kpi.month === month));
      orderedKpis.forEach((kpi, index) => state.kpis.push({ ...kpi, empId, month, seq: index + 1 }));
      resetEvaluationAfterKpiChange(empId, month);
    }

    function getAllDepartments() {
      return ["全部", ...new Set([...BASE_DEPTS, ...state.employees.map(employee => employee.dept).filter(Boolean)])];
    }

    function sortEmployeesByDepartment(employees) {
      const departmentOrder = new Map(getAllDepartments().slice(1).map((department, index) => [department, index]));
      return employees.slice().sort((left, right) => {
        const departmentDifference = (departmentOrder.get(left.dept) ?? 999) - (departmentOrder.get(right.dept) ?? 999);
        return departmentDifference || left.name.localeCompare(right.name, 'zh-CN');
      });
    }

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = renderHeader() + renderTabs() + renderContent() + (state.showSubmitModal ? renderSubmitModal() : '') + (state.showConfirmModal ? renderUnifiedArchiveModal() : '') + (state.showResultModal ? renderResultModal() : '') + (state.showSettingsModal ? renderSettingsModal() : '') + (state.showSyncModal ? renderSyncModal() : '') + (state.managerEditorEmpId ? renderManagerPicker() : '') + (state.evalStageDetail ? renderEvalStageDetailModal() : '') + (state.monthlyEventEditor ? renderMonthlyEventModal() : '') + (state.monthlyEventImagePreview ? renderMonthlyEventImagePreview() : '');
      const dialog = app.querySelector('.modal-box');
      document.body.style.overflow = dialog ? 'hidden' : '';
      if (dialog) {
        app.querySelectorAll('.header,.tabs,.container').forEach(section => { section.inert = true; });
        dialog.setAttribute('role', 'dialog');
        dialog.setAttribute('aria-modal', 'true');
        dialog.setAttribute('tabindex', '-1');
        requestAnimationFrame(() => dialog.focus());
      }
      attachEvents();
      // Persist state to localStorage on every render
      try {
        localStorage.setItem('perf_employees', JSON.stringify(state.employees));
        localStorage.setItem('perf_kpis', JSON.stringify(state.kpis));
        localStorage.setItem('perf_evals', JSON.stringify(state.evals));
        localStorage.setItem('perf_confirmedEmps', JSON.stringify(state.confirmedEmps));
        localStorage.setItem('perf_archivedEmps', JSON.stringify(state.archivedEmps));
        localStorage.setItem('perf_removedEmps', JSON.stringify(state.removedEmps));
      } catch(e) { /* localStorage full or unavailable */ }
    }

    function renderHeader() {
      const activeMonth = [state.kanbanMonth, state.empMonth, state.kpiMonth, state.evalMonth, '操作审计'][state.activeTab] || DEFAULT_ASSESSMENT_MONTH;

          <kbd>Enter</kbd>
        </label>
        <datalist id="employee-search-list">${state.employees.map(employee => `<option value="${escapeHtml(employee.name)}">${escapeHtml(employee.realName)} · ${escapeHtml(employee.dept)}</option>`).join('')}</datalist>
        <div class="header-actions">
          ${ACCESS_CONTEXT.global ? '<button type="button" class="icon-button" data-open-settings aria-label="钉钉通知设置" title="钉钉通知设置">⚙</button>' : ''}
          <div class="user-chip" aria-label="当前账号：${escapeHtml(ACCESS_CONTEXT.name)}">
            <span class="user-avatar">${escapeHtml((ACCESS_CONTEXT.name || '管').slice(0, 1))}</span>

          </div>

      </div></div>`;
    }

    function renderTabs() {
      const activeMonth = [state.kanbanMonth, state.empMonth, state.kpiMonth, state.evalMonth, '操作审计'][state.activeTab] || DEFAULT_ASSESSMENT_MONTH;
      const tabs = [
        { label: "看板", icon: "⌂" },

    function renderContent() {

      ][state.activeTab];

    function renderOperationLogs() {
      if (!ACCESS_CONTEXT.canViewOperationLogs) return '<div class="card"><div class="card-body">无权查看操作日志</div></div>';
      const filters = state.operationLogFilters || { operator: '全部', category: '全部', result: '全部', keyword: '' };
      const logs = Array.isArray(state.operationLogs) ? state.operationLogs : [];
      const operators = [...new Set(logs.map(log => log.actorName).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
      const categories = [...new Set(logs.map(log => log.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
      const keyword = String(filters.keyword || '').trim().toLowerCase();
      const visible = logs.filter(log => {
        if (filters.operator !== '全部' && log.actorName !== filters.operator) return false;
        if (filters.category !== '全部' && log.category !== filters.category) return false;
        if (filters.result === '成功' && !log.success) return false;
        if (filters.result === '失败' && log.success) return false;
        if (keyword && ![log.actorName, log.actorRole, log.category, log.action, log.target, log.ipAddress].some(value => String(value || '').toLowerCase().includes(keyword))) return false;
        return true;
      });
      const rows = visible.map(log => {
        const time = log.serverTime ? new Date(log.serverTime).toLocaleString('zh-CN', { hour12: false }) : '--';
        const detailText = log.details && Object.keys(log.details).length ? JSON.stringify(log.details, null, 2) : '';
        return `<tr>
          <td style="white-space:nowrap">${escapeHtml(time)}</td>
          <td><div class="font-medium text-gray-900">${escapeHtml(log.actorName || '未识别用户')}</div><div class="text-xs text-gray-500">${escapeHtml(log.actorRole || '未知')}</div></td>
          <td><span class="badge badge-gray">${escapeHtml(log.category || '系统操作')}</span><div class="font-medium text-gray-900 mt-1">${escapeHtml(log.action || '--')}</div></td>
          <td style="max-width:360px;word-break:break-word">${escapeHtml(log.target || '--')}${detailText ? `<details style="margin-top:6px"><summary style="cursor:pointer;color:#0f766e;font-size:12px">查看变更摘要</summary><pre style="margin-top:6px;padding:8px;max-height:260px;overflow:auto;white-space:pre-wrap;background:#f8faf9;border-radius:8px;font:11px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace">${escapeHtml(detailText)}</pre></details>` : ''}</td>
          <td><span class="badge ${log.success ? 'badge-green' : 'badge-red'}">${log.success ? '成功' : '失败'} · ${escapeHtml(log.statusCode)}</span><div class="text-xs text-gray-500 mt-1">${log.integrityValid === false ? '完整性校验异常' : '完整性已校验'}</div></td>
          <td><div class="text-xs text-gray-600">${escapeHtml(log.ipAddress || '--')}</div><div class="text-xs text-gray-400 mt-1" title="${escapeHtml(log.userAgent || '')}">${escapeHtml(String(log.userAgent || '').slice(0, 38))}${String(log.userAgent || '').length > 38 ? '…' : ''}</div></td>
        </tr>`;
      }).join('');
      return `<div class="card"><div class="card-body" style="padding:16px">
        <div class="flex items-center justify-between gap-3 flex-wrap"><div><div class="font-medium text-gray-900">操作日志 <span class="badge badge-gray">${visible.length}/${logs.length}</span></div><div class="text-xs text-gray-500 mt-1">日志从本功能上线后开始记录，采用追加写入并进行完整性校验；密码、验证码、令牌和签名内容不会写入日志。</div></div><button type="button" class="btn btn-secondary btn-sm" data-refresh-operation-logs ${state.operationLogLoading ? 'disabled' : ''}>⟳ ${state.operationLogLoading ? '加载中' : '刷新日志'}</button></div>
        <div class="flex gap-2 flex-wrap" style="margin-top:14px">
          <select class="input" data-operation-filter="operator" style="width:auto;min-width:150px"><option>全部</option>${operators.map(value => `<option value="${escapeHtml(value)}" ${filters.operator === value ? 'selected' : ''}>${escapeHtml(value)}</option>`).join('')}</select>
          <select class="input" data-operation-filter="category" style="width:auto;min-width:150px"><option>全部</option>${categories.map(value => `<option value="${escapeHtml(value)}" ${filters.category === value ? 'selected' : ''}>${escapeHtml(value)}</option>`).join('')}</select>
          <select class="input" data-operation-filter="result" style="width:auto;min-width:120px"><option>全部</option><option ${filters.result === '成功' ? 'selected' : ''}>成功</option><option ${filters.result === '失败' ? 'selected' : ''}>失败</option></select>
          <input class="input" data-operation-search value="${escapeHtml(filters.keyword || '')}" placeholder="搜索人员、操作、对象或IP" style="min-width:260px;flex:1">
        </div>
        ${state.operationLogError ? `<div class="alert alert-error" style="margin-top:12px">${escapeHtml(state.operationLogError)}</div>` : ''}
        <div style="overflow:auto;margin-top:14px;border:1px solid #e5ebe7;border-radius:10px"><table style="min-width:1120px;width:100%;font-size:13px"><thead><tr><th>时间</th><th>操作人</th><th>操作</th><th>操作对象／变更摘要</th><th>结果</th><th>来源</th></tr></thead><tbody>${rows || '<tr><td colspan="6" style="text-align:center;padding:36px;color:#94a3b8">暂无符合条件的操作日志</td></tr>'}</tbody></table></div>
      </div></div>`;
    }

    async function refreshOperationLogs() {
      if (!ACCESS_CONTEXT.canViewOperationLogs) return;
      state.operationLogLoading = true;
      state.operationLogError = '';
      try {
        const response = await fetch(SYNC_SERVER_URL + '/operation-logs?limit=500', { cache: 'no-store' });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '操作日志加载失败');
        state.operationLogs = Array.isArray(result.logs) ? result.logs : [];
      } catch (error) {
        state.operationLogError = error.message;
      } finally {
        state.operationLogLoading = false;
      }
    }

    function renderKanban() {
      const monthOrder = month => {
        const match = String(month || '').match(/(\d{4})年(\d{1,2})月/);
        return match ? Number(match[1]) * 12 + Number(match[2]) - 1 : 0;
      };
      const monthFromOrder = order => `${Math.floor(order / 12)}年${order % 12 + 1}月`;
      const previousMonth = monthFromOrder(monthOrder(state.kanbanMonth) - 1);
      const months = assessmentMonthOptions();
      const activeEmployees = state.employees.filter(e => !state.removedEmps.includes(e.id) && employeeParticipatesInMonth(e, state.kanbanMonth));
      const employeesById = new Map(activeEmployees.map(employee => [employee.id, employee]));
      const monthParticipantIds = new Set(state.kpis.filter(kpi => kpi.month === state.kanbanMonth).map(kpi => kpi.empId));
      const monthArchiveKeys = new Set(ARCHIVES.filter(record => archiveMatchesMonth(record, state.kanbanMonth)).map(record => assessmentKey(record.empId, state.kanbanMonth)));
      Object.values(state.targetDrafts || {}).forEach(record => {
        if (record && record.status === 'approved' && record.month === state.kanbanMonth) monthArchiveKeys.add(assessmentKey(record.empId, record.month));
      });
      const monthEvals = state.evals.filter(e => e.month === state.kanbanMonth && monthArchiveKeys.has(assessmentKey(e.empId, e.month)));
      const invalidEvals = monthEvals.filter(e => !isValidEvaluation(e));
      const confirmedEvals = monthEvals.filter(isValidEvaluation);
      // Rankings, grade distribution and alerts are result metrics. Do not
      // treat an unsigned/in-progress row (whose score is null) as a 0-point
      // employee. Only a completed workflow with a valid BP result belongs in
      // these management statistics.
      const finalizedEvals = confirmedEvals.filter(evaluation =>
        evaluation.status === '已完成' && evaluation.bpScore != null && isValidScore(evaluation.bpScore));
      const scoreOf = evaluation => evaluation?.bpScore ?? evaluation?.mgrScore ?? evaluation?.selfScore ?? null;
      const totalEmp = activeEmployees.filter(employee => monthParticipantIds.has(employee.id)).length;
      const done = confirmedEvals.filter(e => e.status === "已完成").length;
      const inProgress = confirmedEvals.length - done;

      const metricsFor = month => {
        const participantIds = new Set(state.kpis.filter(kpi => kpi.month === month).map(kpi => kpi.empId));
        const archiveKeys = new Set(ARCHIVES.filter(record => archiveMatchesMonth(record, month)).map(record => assessmentKey(record.empId, month)));
        const evaluations = state.evals.filter(evaluation => evaluation.month === month && isValidEvaluation(evaluation));
        return {
          participants: activeEmployees.filter(employee => participantIds.has(employee.id)).length,
          confirmed: archiveKeys.size,
          inProgress: evaluations.filter(evaluation => evaluation.status !== '已完成').length,
          done: evaluations.filter(evaluation => evaluation.status === '已完成').length
        };
      };
      const previousMetrics = metricsFor(previousMonth);
      const trendFor = (current, previous) => {
        if (!previous) return { cls: '', arrow: '—', text: '环比 --' };
        const change = Math.round((current - previous) / previous * 1000) / 10;
        if (!change) return { cls: '', arrow: '→', text: '环比 0%' };
        return { cls: change > 0 ? 'up' : 'down', arrow: change > 0 ? '↑' : '↓', text: `环比 ${change > 0 ? '+' : ''}${change}%` };
      };
      const stats = [
        { label: "参评员工", value: totalEmp, icon: "👥", trend: trendFor(totalEmp, previousMetrics.participants) },
        { label: "已确认目标", value: monthArchiveKeys.size, icon: "✓", trend: trendFor(monthArchiveKeys.size, previousMetrics.confirmed) },
        { label: "评估进行中", value: inProgress, icon: "◫", trend: trendFor(inProgress, previousMetrics.inProgress) },
        { label: "已完成", value: done, icon: "✓", trend: trendFor(done, previousMetrics.done) }
      ];

      const stageCounts = STAGES.map(stage => ({ stage, count: confirmedEvals.filter(evaluation => evaluation.status === stage).length }));
      const actualProgress = confirmedEvals.length ? Math.round(confirmedEvals.reduce((sum, evaluation) => {
        const index = Math.max(0, STAGES.indexOf(evaluation.status));
        return sum + index / Math.max(1, STAGES.length - 1) * 100;
      }, 0) / confirmedEvals.length) : 0;
      const now = new Date();
      const selectedOrder = monthOrder(state.kanbanMonth);
      const currentOrder = now.getFullYear() * 12 + now.getMonth();
      const targetProgress = selectedOrder < currentOrder ? 100 : selectedOrder > currentOrder ? 0 : Math.round(now.getDate() / new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() * 100);

      const trendMonths = Array.from({ length: 6 }, (_, index) => monthFromOrder(monthOrder(state.kanbanMonth) - 5 + index));
      const companyTrend = trendMonths.map(month => {
        const scores = state.evals.filter(evaluation => evaluation.month === month && evaluation.status === '已完成' &&
          evaluation.bpScore != null && isValidEvaluation(evaluation)).map(evaluation => Number(evaluation.bpScore)).filter(Number.isFinite);
        return { month, value: scores.length ? Math.round(scores.reduce((sum, score) => sum + score, 0) / scores.length * 10) / 10 : null, count: scores.length };
      });
      const validCompanyTrend = companyTrend.filter(item => Number.isFinite(item.value));
      const rawMin = validCompanyTrend.length ? Math.min(...validCompanyTrend.map(item => item.value)) : 60;
      const rawMax = validCompanyTrend.length ? Math.max(...validCompanyTrend.map(item => item.value)) : 120;
      const trendMin = Math.max(0, Math.floor((rawMin - 10) / 10) * 10);
      const trendMax = Math.min(120, Math.max(trendMin + 20, Math.ceil((rawMax + 10) / 10) * 10));
      const trendChartWidth = 720;
      const trendChartHeight = 154;
      const trendPoints = companyTrend.map((item, index) => ({ ...item, x: 18 + index * (trendChartWidth - 36) / 5, y: item.value == null ? null : 8 + (trendMax - item.value) / Math.max(1, trendMax - trendMin) * (trendChartHeight - 16) }));
      const availableTrendPoints = trendPoints.filter(point => point.y != null);
      const smoothLinePath = points => {
        if (!points.length) return '';
        if (points.length === 1) return `M ${points[0].x} ${points[0].y}`;
        return points.slice(1).reduce((path, point, index) => {
          const previous = points[index];
          const midpoint = (previous.x + point.x) / 2;
          return `${path} C ${midpoint} ${previous.y}, ${midpoint} ${point.y}, ${point.x} ${point.y}`;
        }, `M ${points[0].x} ${points[0].y}`);
      };
      const trendPath = smoothLinePath(availableTrendPoints);
      const areaPath = availableTrendPoints.length > 1 ? `${trendPath} L ${availableTrendPoints.at(-1).x} ${trendChartHeight} L ${availableTrendPoints[0].x} ${trendChartHeight} Z` : '';
      const latestTrend = availableTrendPoints.at(-1);
      const priorTrend = availableTrendPoints.at(-2);
      const trendDelta = latestTrend && priorTrend ? Math.round((latestTrend.value - priorTrend.value) * 10) / 10 : null;

      const targetShare = { "A-": 5, "B+": 15, "B": 35, "B-": 30, "C": 10, "D": 5 };
      const gradeData = GRADE_RULES.map(grade => {
        const count = finalizedEvals.filter(evaluation => getGrade(Number(evaluation.bpScore))?.grade === grade.grade).length;
        const actual = finalizedEvals.length ? Math.round(count / finalizedEvals.length * 1000) / 10 : 0;
        return { ...grade, count, actual, target: targetShare[grade.grade] || 0, gap: Math.round((actual - (targetShare[grade.grade] || 0)) * 10) / 10 };
      });
      let donutCursor = 0;
      const donutStops = gradeData.filter(item => item.actual > 0).map(item => {
        const start = donutCursor;
        donutCursor += item.actual;
        return `${item.color} ${start}% ${donutCursor}%`;
      });
      const donutBackground = donutStops.length ? `conic-gradient(${donutStops.join(',')})` : 'conic-gradient(#e9ede7 0 100%)';

      const deptCounts = {};
      activeEmployees.forEach(employee => { deptCounts[employee.dept] = (deptCounts[employee.dept] || 0) + 1; });
      const deptEntries = Object.entries(deptCounts).sort((left, right) => right[1] - left[1] || left[0].localeCompare(right[0], 'zh-CN'));
      const maxDeptCount = Math.max(1, ...deptEntries.map(([, count]) => count));

      const deptPerfMap = {};
      finalizedEvals.forEach(evaluation => {
        const employee = employeesById.get(evaluation.empId);
        const score = scoreOf(evaluation);
        if (!employee || score == null) return;
        (deptPerfMap[employee.dept] ||= []).push(score);
      });
      const deptRanking = Object.entries(deptPerfMap).map(([dept, scores]) => ({
        dept,
        count: scores.length,
        avg: Math.round(scores.reduce((sum, score) => sum + score, 0) / scores.length * 10) / 10
      })).sort((left, right) => right.avg - left.avg || right.count - left.count);
      const topDepartments = deptRanking.slice(0, 5);
      const bottomDepartments = [...deptRanking].sort((left, right) => left.avg - right.avg || right.count - left.count).slice(0, 5);
      const departmentMaxScore = Math.max(120, ...deptRanking.map(item => item.avg));

      const scoreHistory = new Map();
      state.evals.filter(evaluation => evaluation.status === '已完成' && evaluation.bpScore != null && isValidEvaluation(evaluation)).forEach(evaluation => {
        const score = Number(evaluation.bpScore);
        if (score == null || monthOrder(evaluation.month) > monthOrder(state.kanbanMonth)) return;
        if (!scoreHistory.has(evaluation.empId)) scoreHistory.set(evaluation.empId, new Map());
        scoreHistory.get(evaluation.empId).set(evaluation.month, score);
      });
      const previousTwoMonth = monthFromOrder(monthOrder(state.kanbanMonth) - 2);
      const decliningEmployees = activeEmployees.filter(employee => {
        const history = scoreHistory.get(employee.id);
        if (!history) return false;
        const first = history.get(previousTwoMonth);
        const second = history.get(previousMonth);
        const third = history.get(state.kanbanMonth);
        return [first, second, third].every(Number.isFinite) && first > second && second > third;
      });
      const lowScoreEmployees = finalizedEvals.filter(evaluation => Number(evaluation.bpScore) < 70).map(evaluation => ({
        employee: employeesById.get(evaluation.empId),
        score: Number(evaluation.bpScore)
      })).filter(item => item.employee).sort((left, right) => left.score - right.score);
      const performanceStars = finalizedEvals.map(evaluation => ({ employee: employeesById.get(evaluation.empId), score: Number(evaluation.bpScore) }))
        .filter(item => item.employee && Number.isFinite(item.score)).sort((left, right) => right.score - left.score).slice(0, 3);

      const rankRows = (items, type) => items.length ? items.map((item, index) => `<div class="rank-row"><div class="rank-row-head"><span class="rank-row-name"><span class="rank-index">${String(index + 1).padStart(2, '0')}</span><span class="rank-label" title="${escapeHtml(item.dept)}">${escapeHtml(item.dept)}</span></span><span class="rank-score">平均 ${item.avg} 分</span></div><span class="rank-track"><span class="rank-fill ${type}" style="width:${Math.max(3, item.avg / departmentMaxScore * 100)}%"></span></span></div>`).join('') : `<div class="empty-insight">本月尚无可用于部门排名的有效评分。</div>`;
      const warningPanelHtml = decliningEmployees.length + lowScoreEmployees.length ? `<div class="warning-list">${decliningEmployees.map(employee => { const history = scoreHistory.get(employee.id); return `<div class="warning-list-row" data-dashboard-drill="${employee.id}"><span class="warning-type decline">连续下降</span><span class="warning-person-copy"><strong>${escapeHtml(employee.name)}（${escapeHtml(employee.realName)}）</strong><span>${escapeHtml(employee.dept)} · ${previousTwoMonth.replace(/\d{4}年/, '')} ${history.get(previousTwoMonth)} → ${previousMonth.replace(/\d{4}年/, '')} ${history.get(previousMonth)} → ${state.kanbanMonth.replace(/\d{4}年/, '')} ${history.get(state.kanbanMonth)}</span></span><span class="warning-score">查看</span></div>`; }).join('')}${lowScoreEmployees.map(item => `<div class="warning-list-row" data-dashboard-drill="${item.employee.id}"><span class="warning-type low">低于70分</span><span class="warning-person-copy"><strong>${escapeHtml(item.employee.name)}（${escapeHtml(item.employee.realName)}）</strong><span>${escapeHtml(item.employee.dept)} · 本月绩效低于及格线</span></span><span class="warning-score">${item.score}分</span></div>`).join('')}</div>` : `<div class="warning-empty" style="min-height:84px"><div><span class="warning-empty-icon">✓</span><strong>暂无异常，全员状态良好</strong><span>持续监控连续下降和低于70分的情况</span></div></div>`;
      const scoreGuideHtml = `<div class="grade-guide-header grade-guide-grid"><span>等级</span><span>评价</span><span class="grade-guide-range">分数区间</span><span style="text-align:right">系数</span></div><div class="text-sm">${GRADE_RULES.map(grade => `<div class="grade-guide-row grade-guide-grid"><span class="badge ${grade.cls}" style="font-weight:700;justify-self:start">${grade.grade}</span><span class="text-gray-600">${grade.label}</span><span class="grade-guide-range">${grade.threshold}</span><span class="grade-guide-coeff">${grade.coeff}</span></div>`).join('')}</div>`;
      const trendChartHtml = `<div class="line-chart-wrap"><div class="line-chart-y"><span>${trendMax}</span><span>${Math.round((trendMin + trendMax) / 2)}</span><span>${trendMin}</span></div><svg class="line-chart-svg" viewBox="0 0 ${trendChartWidth} ${trendChartHeight}" preserveAspectRatio="none" role="img" aria-label="近6个月公司绩效平均分趋势"><defs><linearGradient id="scoreAreaGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#76b8a8" stop-opacity=".42"/><stop offset="100%" stop-color="#eef5f0" stop-opacity=".08"/></linearGradient></defs>${[0, .5, 1].map(ratio => `<line class="line-chart-grid" x1="0" x2="${trendChartWidth}" y1="${8 + ratio * (trendChartHeight - 16)}" y2="${8 + ratio * (trendChartHeight - 16)}"/>`).join('')}${areaPath ? `<path class="line-chart-area" d="${areaPath}"/>` : ''}${trendPath ? `<path class="line-chart-path" d="${trendPath}"/>` : ''}${availableTrendPoints.map(point => `<circle class="line-chart-dot" cx="${point.x}" cy="${point.y}" r="5"/><text class="line-chart-value" x="${point.x}" y="${Math.max(10, point.y - 12)}">${point.value}</text>`).join('')}</svg><div class="line-chart-months">${companyTrend.map(item => `<span>${item.month.replace(/\d{4}年/, '')}${item.value == null ? ' · --' : ''}</span>`).join('')}</div></div>`;

      let dashboardHtml = `<div class="dashboard-stack">`;
      dashboardHtml += `<div class="card" style="padding:12px 16px"><label class="flex items-center gap-3" style="width:max-content;max-width:100%"><span class="text-sm font-medium text-gray-600">考核月份：</span><select class="input" data-kanban-month style="min-width:160px;padding:7px 34px 7px 11px;font-size:13px">${months.map(month => `<option value="${month}" ${state.kanbanMonth === month ? 'selected' : ''}>${month}</option>`).join('')}</select></label></div>`;
      dashboardHtml += `<section class="dashboard-stat-grid" aria-label="绩效核心指标">${stats.map(stat => `<article class="card dashboard-stat"><div class="dashboard-stat-top"><div class="stat-icon">${stat.icon}</div><span class="stat-label">${stat.label}</span></div><div><div class="stat-value">${stat.value}</div><div class="stat-trend ${stat.trend.cls}"><span>${stat.trend.arrow}</span>${stat.trend.text}</div></div></article>`).join('')}</section>`;
      if (invalidEvals.length) dashboardHtml += `<div class="alert alert-red" role="alert"><strong>发现 ${invalidEvals.length} 条异常评分，已从本月评级、排名与统计中排除。</strong> 请先修正异常数据后再归档。</div>`;

      dashboardHtml += `<section class="dashboard-grid-2">
        <article class="card"><div class="card-body"><div class="dashboard-card-title"><div><h3>评估进度对比</h3><p>实际流程推进与本月计划目标对比</p></div><span class="metric-pill">${actualProgress >= targetProgress ? '进度正常' : '进度滞后'}</span></div><div class="dual-progress"><div class="dual-progress-row"><span class="dual-progress-label">实际进度</span><span class="dual-track"><span class="dual-fill actual" style="width:${actualProgress}%"></span></span><span class="dual-progress-value">${actualProgress}%</span></div><div class="dual-progress-row"><span class="dual-progress-label">目标进度</span><span class="dual-track"><span class="dual-fill target" style="width:${targetProgress}%"></span></span><span class="dual-progress-value">${targetProgress}%</span></div></div><div class="stage-timeline">${stageCounts.map((item, index) => `<div class="stage-node ${item.count || index === 0 ? 'active' : ''}"><strong>${item.stage}</strong><span>${item.count}</span></div>`).join('')}</div></div></article>
        <article class="card"><div class="card-body"><div class="dashboard-card-title"><div><h3>当月绩效之星</h3><p>按最终有效得分展示前 3 名员工</p></div><span class="metric-pill">TOP 3</span></div><div class="star-list">${performanceStars.length ? performanceStars.map((item, index) => `<div class="star-row rank-${index + 1}"><span class="star-rank">${index + 1}</span><div class="star-person"><strong>${escapeHtml(item.employee.name)}（${escapeHtml(item.employee.realName)}）</strong><span>${escapeHtml(item.employee.dept)}</span></div><b class="star-score">${item.score}<small>分</small></b></div>`).join('') : '<div class="empty-state compact"><div>暂无已完成绩效数据</div></div>'}</div><div class="insight-divider"></div><div class="compact-subtitle"><strong>绩效预警 · 异常监控</strong><span>${decliningEmployees.length + lowScoreEmployees.length} 项预警</span></div>${warningPanelHtml}</div></article>
      </section>`;

      dashboardHtml += `<section class="card"><div class="card-body"><div class="dashboard-card-title"><div><h3>绩效等级分布</h3><p>圆环展示整体结构，右侧展示人数、实际占比与目标差距</p></div><span class="metric-pill">有效样本 ${finalizedEvals.length} 人</span></div><div class="grade-visual"><div class="donut-panel"><div class="donut-chart" style="--donut:${donutBackground}"><div class="donut-center"><strong>${finalizedEvals.length}</strong><span>参评人数</span></div></div><div class="donut-legend">${gradeData.map(item => `<span class="donut-legend-item"><i class="donut-legend-dot" style="--legend-color:${item.color}"></i><span>${item.grade}</span><b>${item.actual}%</b></span>`).join('')}</div></div><div class="grade-gap-list"><div class="grade-gap-row" style="font-weight:800;color:#7a8581"><span>等级</span><span>评价</span><span class="grade-gap-value">实际</span><span class="grade-gap-value">目标</span><span class="grade-gap-value">差距</span></div>${gradeData.map(item => `<div class="grade-gap-row"><span><b class="badge ${item.cls}">${item.grade}</b></span><span>${item.label} · ${item.count}人</span><span class="grade-gap-value">${item.actual}%</span><span class="grade-gap-value">${item.target}%</span><span class="grade-gap-value ${item.gap > 0 ? 'gap-positive' : item.gap < 0 ? 'gap-negative' : ''}">${item.gap > 0 ? '+' : ''}${item.gap}%</span></div>`).join('')}</div></div></div></section>`;

      dashboardHtml += `<section class="dashboard-grid-even">
        <article class="card"><div class="card-body"><div class="dashboard-card-title"><div><h3>部门人员分布</h3><p>按在职人数从多到少自动排序</p></div><span class="metric-pill">共 ${activeEmployees.length} 人</span></div><div class="horizontal-bars">${deptEntries.map(([dept, count]) => { const ratio = activeEmployees.length ? Math.round(count / activeEmployees.length * 100) : 0; return `<div class="horizontal-bar-row"><span class="horizontal-bar-label" title="${escapeHtml(dept)}">${escapeHtml(dept)}</span><span class="horizontal-bar-track"><span class="horizontal-bar-fill" style="width:${Math.max(4, count / maxDeptCount * 100)}%">${ratio}%</span></span><strong class="horizontal-bar-number">${count}人</strong></div>`; }).join('')}</div></div></article>
        <article class="card"><div class="card-body"><div class="dashboard-card-title"><div><h3>评分标准速查</h3><p>当前系统评级规则与奖金系数</p></div></div>${scoreGuideHtml}</div></article>
      </section>`;

      dashboardHtml += `<section class="dashboard-grid-even dashboard-bottom-insights">
        <article class="card company-trend-card"><div class="card-body"><div class="dashboard-card-title"><div><h3>近 6 个月全公司绩效平均分</h3><p>仅统计通过评分校验的有效考核结果</p></div><div class="trend-summary">${trendDelta == null ? `<span>历史数据累积中</span>` : `<span>较上个有效月份</span><strong style="color:${trendDelta >= 0 ? '#13805e' : '#d35454'}">${trendDelta >= 0 ? '↑ +' : '↓ '}${trendDelta} 分</strong>`}</div></div>${trendChartHtml}</div></article>
        <article class="card"><div class="card-body"><div class="dashboard-card-title"><div><h3>部门绩效排名</h3><p>平均分最高 Top 5 与最低 Bottom 5 对照</p></div><span class="metric-pill">部门均分</span></div><div class="rank-columns"><div><h4 class="rank-column-title top">Top 5</h4>${rankRows(topDepartments, 'top')}</div><div><h4 class="rank-column-title bottom">Bottom 5</h4>${rankRows(bottomDepartments, 'bottom')}</div></div></div></article>
      </section>`;
      dashboardHtml += `</div>`;
      return dashboardHtml;

      let html = `<div class="dashboard-stack">`;
      html += `<div class="card" style="padding:12px 16px"><label class="flex items-center gap-3" style="width:max-content;max-width:100%"><span class="text-sm font-medium text-gray-600">考核月份：</span><select class="input" data-kanban-month style="min-width:160px;padding:7px 34px 7px 11px;font-size:13px">${months.map(month => `<option value="${month}" ${state.kanbanMonth === month ? 'selected' : ''}>${month}</option>`).join('')}</select></label></div>`;
      html += `<section class="dashboard-stat-grid" aria-label="绩效核心指标">${stats.map(stat => `<article class="card dashboard-stat"><div class="dashboard-stat-top"><div class="stat-icon">${stat.icon}</div><span class="stat-label">${stat.label}</span></div><div><div class="stat-value">${stat.value}</div><div class="stat-trend ${stat.trend.cls}"><span class="trend-arrow">${stat.trend.arrow}</span>${stat.trend.text}</div></div></article>`).join('')}</section>`;

      if (invalidEvals.length) html += `<div class="alert alert-red" role="alert"><strong>发现 ${invalidEvals.length} 条异常评分，已从本月评级、排名与统计中排除。</strong> 请先修正异常数据后再归档。</div>`;

      html += `<section class="card"><div class="card-body"><div class="dashboard-card-title"><div><h3>绩效等级分布</h3><p>圆环展示整体结构，右侧展示人数、实际占比与目标差距</p></div><span class="metric-pill">有效样本 ${finalizedEvals.length} 人</span></div><div class="grade-visual"><div class="donut-panel"><div class="donut-chart" style="--donut:${donutBackground}"><div class="donut-center"><strong>${finalizedEvals.length}</strong><span>有效参评人数</span></div></div><div class="donut-legend">${gradeData.map(item => `<div class="donut-legend-item"><span class="donut-legend-dot" style="--legend-color:${item.color}"></span><strong>${item.grade}</strong><span>${item.actual}%</span></div>`).join('')}</div></div><div class="grade-gap-list"><div class="grade-gap-row" style="font-weight:800;color:#89938f"><span>等级</span><span>评价</span><span class="grade-gap-value">人数</span><span class="grade-gap-value">实际</span><span class="grade-gap-value">目标差</span></div>${gradeData.map(item => `<div class="grade-gap-row"><span class="badge ${item.cls}" style="font-weight:800;justify-self:start">${item.grade}</span><span>${item.label}</span><span class="grade-gap-value">${item.count}人</span><span class="grade-gap-value">${item.actual}%</span><span class="grade-gap-value ${item.gap > 0 ? 'gap-positive' : item.gap < 0 ? 'gap-negative' : ''}">${item.gap > 0 ? '+' : ''}${item.gap}%</span></div>`).join('')}</div></div></div></section>`;

    function renderEmployees() {
      const activeEmployees = state.employees.filter(e => !state.removedEmps.includes(e.id) && employeeParticipatesInMonth(e, state.empMonth));
      const filtered = sortEmployeesByDepartment(state.deptFilter === "全部" ? activeEmployees : activeEmployees.filter(e => e.dept === state.deptFilter));
      const headers = ["花名", "真实姓名", "部门", "岗位", "直属上级", "HRBP", "状态", "操作"];

      // Determine each employee's overall status
      function getEmpStatus(empId) {
        const isConfirmed = hasAuthorizedTargets(empId, state.empMonth);
        const ev = state.evals.find(e => e.empId === empId && e.month === state.empMonth);
        const resultArch = ev ? validResultArchiveFor(empId, ev.month, ev) : null;
        // Server-side target confirmation is the workflow entry point. Ignore
        // stale local evaluation records when the target confirmation was reset.
        if (!isConfirmed) return { text: "目标制定中", cls: "badge-gray", order: 0 };
        if (ev && ev.status === "已完成" && resultArch) return { text: "已归档", cls: "badge-green", order: 5 };
        if (ev && ev.status === "已完成") return { text: "已完成", cls: "badge-green", order: 4 };
        if (ev && ev.status === "待BP核准") return { text: "BP评分中", cls: "badge-cyan", order: 3 };
        if (ev && ev.status === "待上级评分") return { text: "上级评分中", cls: "badge-blue", order: 2 };
        if (ev && ev.status === "待自评") return selfEvaluationNoticeWasSent(empId, state.empMonth)
          ? { text: "自评中", cls: "badge-amber", order: 1 }
          : { text: "待发送自评", cls: "badge-amber", order: 1 };
        if (!ev) return { text: "待发送自评", cls: "badge-amber", order: 1 };
        return { text: "待发送自评", cls: "badge-amber", order: 1 };
      }

      let html = `<div class="space-y-4">`;

      // Filter bar: department + month
      const months = assessmentMonthOptions();
      html += `<div class="card" style="padding:12px 16px"><div class="flex items-center justify-between flex-wrap gap-3">
        <div class="flex gap-2 flex-wrap">${getAllDepartments().map(d => {
          const cnt = d === '全部' ? activeEmployees.length : activeEmployees.filter(e => e.dept === d).length;
          return `<button class="emp-btn ${state.deptFilter === d ? 'active' : ''}" data-dept-filter="${d}" style="font-size:13px;padding:6px 14px">${d} (${cnt})</button>`;

      const statusCounts = { "目标制定中": 0, "待发送自评": 0, "自评中": 0, "上级评分中": 0, "BP评分中": 0, "已完成": 0, "已归档": 0 };
      filtered.forEach(emp => {
        const s = getEmpStatus(emp.id);
        if (statusCounts[s.text] !== undefined) statusCounts[s.text]++;
      });
      const statusColors = { "目标制定中": "#9ca3af", "待发送自评": "#d97706", "自评中": "#f59e0b", "上级评分中": "#3b82f6", "BP评分中": "#06b6d4", "已完成": "#10b981", "已归档": "#059669" };
      html += `<div class="card" style="padding:10px 16px"><div class="flex items-center gap-4 flex-wrap">
        ${Object.entries(statusCounts).filter(([,c]) => c > 0).map(([label, count]) =>
          `<div class="flex items-center gap-1"><span style="width:8px;height:8px;border-radius:50%;background:${statusColors[label]}"></span><span class="text-xs text-gray-600">${label}</span><span class="text-xs font-bold" style="color:${statusColors[label]}">${count}</span></div>`
        ).join('')}

      let previousDepartment = null;
      const employeeRows = filtered.map(emp => {
          const st = getEmpStatus(emp.id);
          const departmentHeader = emp.dept !== previousDepartment
            ? `<tr><td colspan="8" style="padding:9px 16px;background:#f8fafc;color:#2563eb;font-size:12px;font-weight:700;border-top:1px solid #dbeafe;border-bottom:1px solid #dbeafe">${emp.dept} · ${filtered.filter(item => item.dept === emp.dept).length} 人</td></tr>`
            : '';
          previousDepartment = emp.dept;
          return `${departmentHeader}<tr>
          <td class="font-medium text-gray-900">${emp.name}</td>

          <td><span class="badge ${st.cls}">${st.text}</span></td>
          <td><button class="btn btn-secondary btn-sm" data-remove-emp="${emp.id}" style="color:#dc2626;border-color:#fecaca;font-size:11px">移除</button></td>

        }).join('');

        <tbody>${employeeRows}</tbody></table>
      </div></div>`;
      return html;
    }

    function targetInviteCandidates(month) {
      return state.employees.filter(employee => {
        if (state.removedEmps.includes(employee.id) || !employeeParticipatesInMonth(employee, month)) return false;
        const key = assessmentKey(employee.id, month);
        if (isKpiSubmissionLocked(employee.id, month)) return false;
        if (state.targetDrafts[key] || state.submittedTargetKeys.includes(key)) return false;
        return !state.kpis.some(kpi => kpi.empId === employee.id && kpi.month === month);
      });
    }

    function targetReminderCandidates(month) {
      const reminderStages = {
        invited: { key: 'employee-fill', label: '员工填写目标' },
        rejected: { key: 'employee-fill', label: '员工修改目标' },
        submitted: { key: 'manager-review', label: '上级确认目标' },
        manager_approved: { key: 'bp-review', label: 'BP确认目标' },
        approved: { key: 'employee-sign', label: '员工确认目标签字' }
      };
      return state.employees.flatMap(employee => {
        if (state.removedEmps.includes(employee.id) || !employeeParticipatesInMonth(employee, month)) return [];
        if (isKpiSubmissionLocked(employee.id, month)) return [];
        const key = assessmentKey(employee.id, month);
        const draft = state.targetDrafts[key] || null;
        if (draft) {
          if (draft.status === 'rejected' && draft.source === 'admin-entry') return [];
          const stage = reminderStages[draft.status];
          return stage ? [{ employee, stage: stage.key, stageLabel: stage.label }] : [];
        }
        // Compatibility for targets submitted before the multi-step draft
        // workflow was introduced: they are waiting for employee signature.
        if (state.submittedTargetKeys.includes(key)) {
          return [{ employee, stage: 'employee-sign', stageLabel: '员工确认目标签字' }];
        }
        return [];
      });
    }

    function renderEmbeddedOkrPanel(employee) {

      const renderObjectives = (items, periodLabel) => items.map((objective, objectiveIndex) => `<div class="kpi-card"><div class="flex items-center gap-2 mb-2"><div class="kpi-num">O${objectiveIndex + 1}</div><span class="font-medium text-gray-900">${escapeHtml(objective.title)}</span><span class="badge badge-gray">${Number(objective.weight) || 0}%</span></div>${(objective.keyResults || []).map((kr, krIndex) => `<div style="margin:8px 0 0 48px;padding:10px 12px;border-left:3px solid #93c5fd;background:#f8fafc;border-radius:7px"><div><strong>KR${krIndex + 1}：</strong>${escapeHtml(kr.result)} <span class="text-xs" style="color:#2563eb">${Number(kr.weight) || 0}%</span></div>${kr.completion ? `<div class="text-xs mt-1" style="color:#047857">完成情况：${escapeHtml(kr.completion)}</div>` : ''}</div>`).join('')}</div>`).join('');
      const weeklySections = weeklyObjectives.filter(period => Array.isArray(period.objectives) && period.objectives.length).map(period => `<section style="margin-top:14px;padding:14px;border:1px solid #dce7e2;border-radius:12px;background:#fbfdfc"><div class="font-medium" style="color:#176556;margin-bottom:10px">${escapeHtml(period.label || ('第' + period.week + '周'))} O / KR</div><div class="space-y-3">${renderObjectives(period.objectives, period.label)}</div></section>`).join('');

    function monthlyEventDateRange(month) {
      const match = String(month || '').match(/^(\d{4})年(\d{1,2})月$/);
      if (!match) return { first: '', last: '' };
      const year = Number(match[1]), monthNumber = Number(match[2]);
      const pad = value => String(value).padStart(2, '0');
      return {
        first: `${year}-${pad(monthNumber)}-01`,
        last: `${year}-${pad(monthNumber)}-${pad(new Date(year, monthNumber, 0).getDate())}`
      };
    }

    function renderKPI() {
      const activeEmployees = state.employees.filter(e => !state.removedEmps.includes(e.id) && employeeParticipatesInMonth(e, state.kpiMonth));
      const bulkInviteCandidates = targetInviteCandidates(state.kpiMonth);
      const bulkReminderCandidates = targetReminderCandidates(state.kpiMonth);
      const filteredEmps = sortEmployeesByDepartment(state.kpiDeptFilter === "全部" ? activeEmployees : activeEmployees.filter(e => e.dept === state.kpiDeptFilter));
      if (!filteredEmps.some(employee => employee.id === state.selectedKpiEmp)) {
        state.selectedKpiEmp = filteredEmps[0]?.id || null;
        state.selectedKpiMode = 'kpi';
      }
      const emp = state.employees.find(e => e.id === state.selectedKpiEmp);
      const monthKpis = state.kpis.filter(k => k.month === state.kpiMonth);
      let empKpis = monthKpis.filter(k => k.empId === state.selectedKpiEmp);
      let totalWeight = empKpis.reduce((s, k) => s + k.weight, 0);
      const newDraft = getKpiDraft(0, { indicator: '', dataSource: '', rule: '', weight: '0' });
      const selectedMergeSet = new Set(state.selectedMergeKpis.map(Number));
      const kpiLocked = isKpiSubmissionLocked(state.selectedKpiEmp, state.kpiMonth);
      const targetSubmitted = state.submittedTargetKeys.includes(assessmentKey(state.selectedKpiEmp, state.kpiMonth));
      const targetDraft = state.targetDrafts[assessmentKey(state.selectedKpiEmp, state.kpiMonth)] || null;
      const targetAdjustmentInProgress = Boolean(targetDraft && targetDraft.isTargetAdjustment && !targetDraft.targetSignedAt);
      if (!empKpis.length && targetDraft && Array.isArray(targetDraft.kpis) && targetDraft.kpis.length) {
        empKpis = targetDraft.kpis.map((item, index) => ({ ...item, seq: Number(item.seq) || index + 1, empId: state.selectedKpiEmp, month: state.kpiMonth }));
        totalWeight = empKpis.reduce((sum, item) => sum + Number(item.weight || 0), 0);
      }
      if (targetDraft && targetDraft.isTargetAdjustment && Array.isArray(targetDraft.kpis) && targetDraft.kpis.length) {
        empKpis = targetDraft.kpis.map((item, index) => ({ ...item, seq: Number(item.seq) || index + 1, empId: state.selectedKpiEmp, month: state.kpiMonth }));
        totalWeight = empKpis.reduce((sum, item) => sum + Number(item.weight || 0), 0);
      }
      const adminTargetRejected = Boolean(targetDraft && targetDraft.source === 'admin-entry' && targetDraft.status === 'rejected');
      const canTakeOverInvitedTarget = Boolean(targetDraft && targetDraft.status === 'invited' && (!Array.isArray(targetDraft.kpis) || targetDraft.kpis.length === 0));
      const targetFlowReadOnly = Boolean(targetDraft && !adminTargetRejected);
      const kpiEditingLocked = kpiLocked || targetFlowReadOnly || !ACCESS_CONTEXT.canAuthorTargets;
      const canBackendEditTarget = ACCESS_CONTEXT.canAuthorTargets && !kpiLocked && !targetSubmitted && (!targetDraft || adminTargetRejected);
      // A target saved by an older release may exist without a draft or a
      // signature archive.  It is not sealed, so allow the administrator to
      // convert it to the current employee-fill confirmation workflow.
      const canInviteTarget = ACCESS_CONTEXT.canAuthorTargets && !kpiLocked && !targetDraft;
      const convertingLegacyTarget = canInviteTarget && targetSubmitted;
      const employeeTargetApproved = Boolean(targetDraft && targetDraft.status === 'approved');
      const targetDraftLabels = {
        invited: targetAdjustmentInProgress ? '目标调整：等待员工修改' : '等待员工填写',
        submitted: targetAdjustmentInProgress ? '目标调整：等待直属上级审核' : '等待直属上级确认',
        manager_approved: targetAdjustmentInProgress ? '目标调整：等待BP审核' : '直属上级已确认，等待BP确认',
        rejected: (targetDraft && targetDraft.rejectedBy === 'manager' ? '直属上级已退回修改' : 'BP已退回修改'),
        approved: targetAdjustmentInProgress ? '目标调整：待员工重新签字' : 'BP已确认，待员工目标签字'
      };
      const targetReminderLabels = { invited: targetAdjustmentInProgress ? '催办员工调整目标' : '催办员工填写目标', submitted: '催办直属上级确认', manager_approved: '催办BP确认目标', approved: '催办员工目标签字' };
      const performanceWorkflowStarted = state.evals.some(evaluation => evaluation.empId === state.selectedKpiEmp && evaluation.month === state.kpiMonth);
      const canRequestTargetAdjustment = Boolean(ACCESS_CONTEXT.canInitiateTargetAdjustment && kpiLocked && !targetAdjustmentInProgress && !performanceWorkflowStarted);
      const targetAdjustmentTitle = !ACCESS_CONTEXT.canInitiateTargetAdjustment ? '仅桑葚、薏米、路得、Ben四名管理员可发起' : !kpiLocked ? '目标签字归档后才可发起' : targetAdjustmentInProgress ? '已有进行中的目标调整申请' : performanceWorkflowStarted ? '绩效评分流程已启动，不能再调整目标' : '发起目标调整申请';

      // Generate available months
      const availableMonths = assessmentMonthOptions();

      // Count KPI-ready employees for current month
      const monthKpiEmpIds = [...new Set(monthKpis.map(k => k.empId))];
      const readyCount = monthKpiEmpIds.filter(eid => {
        if (isKpiSubmissionLocked(eid, state.kpiMonth) || hasActiveTargetWorkflow(eid, state.kpiMonth)) return false;
        const ek = monthKpis.filter(k => k.empId === eid);
        return ek.reduce((s, k) => s + k.weight, 0) === 100;

      let html = `<div class="space-y-4">`;

      // Send status banner (shown after KPI submit)
