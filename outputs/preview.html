    function identityMatchesRosterSubject(identity, subject) {
      if (!identity || !subject) return true;
      const identityName = String(identity.name || identity.nick || '').trim();
      const identityRealName = String(identity.realName || '').trim();
      const subjectName = String(subject.nick || subject.name || '').trim();
      const subjectRealName = String(subject.realName || '').trim();
      if (identityRealName && subjectRealName) return identityRealName === subjectRealName;
      if (identityName && subjectName) return identityName === subjectName;
      return true;
    }

    function purgeCollidingLocalWorkflowId(empId) {
      state.kpis.splice(0, state.kpis.length, ...state.kpis.filter(record => record.empId !== empId));
      state.evals.splice(0, state.evals.length, ...state.evals.filter(record => record.empId !== empId));
      ARCHIVES.splice(0, ARCHIVES.length, ...ARCHIVES.filter(record => record.empId !== empId));
      state.confirmedEmps = state.confirmedEmps.filter(id => id !== empId);
      state.archivedEmps = state.archivedEmps.filter(id => id !== empId);
      for (const collection of [state.kpiDrafts || {}, state.targetDrafts || {}]) {
        for (const key of Object.keys(collection)) if (key === empId || key.startsWith(empId + '|')) delete collection[key];
      }
      if (window.RESULT_ARCHIVES) {
        for (const key of Object.keys(window.RESULT_ARCHIVES)) if (key === empId || key.startsWith(empId + '|')) delete window.RESULT_ARCHIVES[key];
      }
      try {
        localStorage.removeItem('kpi_selfeval_' + empId);
        localStorage.removeItem('kpi_signed_' + empId);
      } catch (_) {}
    }

    function localWorkflowIdentities(empId) {
      const identities = [];
      state.evals.filter(record => record.empId === empId).forEach(record => identities.push(record));
      ARCHIVES.filter(record => record.empId === empId).forEach(record => identities.push(record));
      for (const collection of [state.kpiDrafts || {}, state.targetDrafts || {}]) {
        for (const [key, record] of Object.entries(collection)) {
          if (key === empId || key.startsWith(empId + '|')) identities.push((record && record.emp) || record);
        }
      }
      return identities.filter(Boolean);
    }

    function remapLocalEmployeeId(oldId, canonicalId, rosterSubject) {
      oldId = String(oldId || '').trim();
      canonicalId = String(canonicalId || '').trim();
      if (!oldId || !canonicalId || oldId === canonicalId) return false;
      const authoritativeOldIdentity = SERVER_EMPLOYEE_IDENTITIES[oldId];
      const conflictingLocalIdentity = localWorkflowIdentities(oldId)
        .find(identity => !identityMatchesRosterSubject(identity, rosterSubject));
      if ((authoritativeOldIdentity && !identityMatchesRosterSubject(authoritativeOldIdentity, rosterSubject)) || conflictingLocalIdentity) {
        // A historic browser allocated the same temporary E-number to two
        // different people. Never transfer HR workflow data across identities;
        // drop the stale local copy and let the server re-import it under the
        // canonical employee ID.
        purgeCollidingLocalWorkflowId(oldId);
        if (state.selectedEmp === oldId) state.selectedEmp = canonicalId;
        if (state.selectedKpiEmp === oldId) state.selectedKpiEmp = canonicalId;
        console.warn('已隔离员工ID碰撞，未迁移旧员工绩效数据:', oldId, canonicalId);
        return true;
      }
      state.kpis.forEach(record => { if (record.empId === oldId) record.empId = canonicalId; });
      state.evals.forEach(record => { if (record.empId === oldId) record.empId = canonicalId; });
      ARCHIVES.forEach(record => { if (record.empId === oldId) record.empId = canonicalId; });
      state.confirmedEmps = [...new Set(state.confirmedEmps.map(id => id === oldId ? canonicalId : id))];
      state.archivedEmps = [...new Set(state.archivedEmps.map(id => id === oldId ? canonicalId : id))];
      state.removedEmps = [...new Set(state.removedEmps.map(id => id === oldId ? canonicalId : id))];
      if (state.selectedEmp === oldId) state.selectedEmp = canonicalId;
      if (state.selectedKpiEmp === oldId) state.selectedKpiEmp = canonicalId;
      return true;
    }

    function mergeRosterEmployees(roster) {
      if (!Array.isArray(roster)) return false;
      roster = roster.filter(employee => !EXCLUDED_EMPLOYEE_NAMES.has(employee.nick));
      let changed = false;
      let maxId = state.employees.reduce((maximum, employee) => {
        const number = parseInt(String(employee.id || '').replace('E', ''), 10);
        return Number.isFinite(number) ? Math.max(maximum, number) : maximum;
      }, 0);
      roster.forEach(rosterEmployee => {
        const canonicalId = String(rosterEmployee.assessmentId || '').trim();
        const matches = state.employees.filter(employee =>
          (canonicalId && employee.id === canonicalId) ||
          employee.name === rosterEmployee.nick ||
          (rosterEmployee.realName && employee.realName === rosterEmployee.realName)
        );
        let existing = matches.find(employee => canonicalId && employee.id === canonicalId) || matches[0];
        if (!existing) {
          if (!canonicalId) maxId++;
          state.employees.push({
            id: canonicalId || ('E' + String(maxId).padStart(3, '0')),
            name: rosterEmployee.nick,
            realName: rosterEmployee.realName || '',
            dept: organizationDepartmentFor(rosterEmployee.nick, rosterEmployee.department || '未分配部门'),
            position: FIXED_POSITION_BY_NAME[rosterEmployee.nick] || rosterEmployee.title || '',
            directMgr: rosterEmployee.directMgr || '',
            indirectMgr: '',
            hrbp: organizationHrbpFor(rosterEmployee.nick, rosterEmployee.department, rosterEmployee.hrbp),
            status: '在职',
            assessmentStartMonth: rosterEmployee.assessmentStartMonth || '',
            assessmentInactiveFromMonth: rosterEmployee.assessmentInactiveFromMonth || ''
          });
          changed = true;
          return;
        }
        if (canonicalId && existing.id !== canonicalId) {
          const oldId = existing.id;
          changed = remapLocalEmployeeId(oldId, canonicalId, rosterEmployee) || changed;
          existing.id = canonicalId;
          changed = true;
        }
        // Remove stale duplicate cards left by historic browser-side ID
        // allocation, while retaining the canonical assessment-roster entry.
        const duplicates = state.employees.filter(employee => employee !== existing && (
          employee.id === canonicalId || employee.name === rosterEmployee.nick ||
          (rosterEmployee.realName && employee.realName === rosterEmployee.realName)
        ));
        duplicates.forEach(duplicate => {
          changed = remapLocalEmployeeId(duplicate.id, existing.id, rosterEmployee) || changed;
          const index = state.employees.indexOf(duplicate);
          if (index >= 0) state.employees.splice(index, 1);
          changed = true;
        });
        const updates = {
          // The server roster is authoritative for the display nickname. This
          // replaces stale names persisted by older browser sessions.
          name: rosterEmployee.nick || existing.name,
          realName: rosterEmployee.realName || existing.realName,
          dept: organizationDepartmentFor(rosterEmployee.nick || existing.name, rosterEmployee.department || existing.dept),
          position: FIXED_POSITION_BY_NAME[rosterEmployee.nick || existing.name] || rosterEmployee.title || existing.position,
          assessmentStartMonth: rosterEmployee.assessmentStartMonth || existing.assessmentStartMonth || '',
          assessmentInactiveFromMonth: rosterEmployee.assessmentInactiveFromMonth || ''
        };
        if (Object.prototype.hasOwnProperty.call(rosterEmployee, 'directMgr')) updates.directMgr = rosterEmployee.directMgr || '';
        updates.hrbp = organizationHrbpFor(updates.name, updates.dept, rosterEmployee.hrbp || existing.hrbp);
        Object.entries(updates).forEach(([key, value]) => {
          if (existing[key] !== value) {
            existing[key] = value;
            changed = true;
          }
        });
      });
      return changed;
    }

    async function syncFromRoster() {
      state.showSyncModal = true;
      state.syncResult = { loading: true, newEmps: [], departed: [], matched: [], total: 0 };
      render();
      try {
        const res = await fetch(SYNC_SERVER_URL + '/employee-roster?refresh=1&assessmentMonth=' + encodeURIComponent(state.empMonth), {
          credentials: 'same-origin',
          cache: 'no-store'
        });
        if (!res.ok) {
          let message = '通讯录同步失败（HTTP ' + res.status + '）';
          try {
            const errorBody = await res.json();
            if (errorBody && errorBody.error) message = errorBody.error;
          } catch (_) {}
          throw new Error(message);
        }
        const data = await res.json();
        if (!data.employees || data.employees.length === 0) {
          state.syncResult = { error: data.warning || '钉钉通讯录为空，请检查自建应用的通讯录权限和可见范围', newEmps: [], departed: [], matched: [], total: 0, loading: false };
          render();
          return;
        }
        const roster = data.employees.filter(employee => !EXCLUDED_EMPLOYEE_NAMES.has(employee.nick) && employee.directoryActive !== false && employeeParticipatesInMonth(employee, state.empMonth));
        const currentEmps = state.employees.filter(e => !state.removedEmps.includes(e.id) && employeeParticipatesInMonth(e, state.empMonth));
        // Match by nick (花名)
        const currentNicks = new Set(currentEmps.map(e => e.name));
        const rosterNicks = new Set(roster.map(e => e.nick));
        const newEmps = roster.filter(e => !currentNicks.has(e.nick));
        const departed = currentEmps.filter(e => !rosterNicks.has(e.name));
        const matched = roster.filter(e => currentNicks.has(e.nick));
        state.syncResult = { newEmps, departed, matched, total: roster.length, loading: false, source: data.source, warning: data.warning || '' };
        render();
      } catch(e) {
        const prefix = window.location.protocol === 'file:' ? '无法连接本地服务：' : '通讯录同步失败：';
        state.syncResult = { error: prefix + e.message, newEmps: [], departed: [], matched: [], total: 0, loading: false };
        render();
      }
    }

    function syncFromServer() {
      let imported = false;

      fetch(SYNC_SERVER_URL + '/performance-exclusions')
        .then(response => response.json())
        .then(data => {
          const next = Array.isArray(data.excludedEmpIds) ? data.excludedEmpIds : [];
          if (JSON.stringify(next.slice().sort()) !== JSON.stringify(state.removedEmps.slice().sort())) {
            state.removedEmps = next;
            renderAfterBackgroundSync(true);
          }
        })
        .catch(() => {});

      fetch(SYNC_SERVER_URL + '/target-drafts')
        .then(response => response.json())
        .then(records => {
          records = records || {};
          const previous = JSON.stringify(state.targetDrafts || {});
          state.targetDrafts = records;
          let changed = previous !== JSON.stringify(records);
          renderAfterBackgroundSync(changed);
        })
        .catch(() => {});

      refreshOkrRecords().catch(() => {});

      // Keep the employee list aligned with DingTalk. New hires are added
      // automatically and are displayed inside their department group.
      fetch(SYNC_SERVER_URL + '/employee-roster')
        .then(response => response.json())
        .then(data => {
          renderAfterBackgroundSync(mergeRosterEmployees(data.employees || []));
        })
        .catch(() => {});

      // Apply server-issued workflow resets to every browser. This removes
      // stale KPI/evaluation data kept in localStorage after an admin reset.
      fetch(SYNC_SERVER_URL + '/workflow-resets')
        .then(response => response.json())
        .then(data => {
          const resets = (data && data.resets) || {};
          let applied = {};
          try { applied = JSON.parse(localStorage.getItem('perf_appliedWorkflowResets') || '{}'); } catch (_) {}
          let changed = false;
          for (const [empId, reset] of Object.entries(resets)) {
            const marker = typeof reset === 'string' ? reset : String((reset && reset.resetAt) || '');
            const resetMonth = typeof reset === 'object' && reset ? String(reset.month || '').trim() : '';
            const appliedKey = assessmentKey(empId, resetMonth || '*');
            if (!marker || applied[appliedKey] === marker) continue;
            const inResetScope = item => item && item.empId === empId && (!resetMonth || item.month === resetMonth);
            const resetTime = Date.parse(marker);
            const hasNewerSignedTarget = Number.isFinite(resetTime) && ARCHIVES.some(record => {
              if (!inResetScope(record) || !record.doc) return false;
              const archivedTime = Date.parse(record.archivedAt || record.signedAt || record.confirmedAt || '');
              return Number.isFinite(archivedTime) && archivedTime > resetTime;
            });
            if (hasNewerSignedTarget) {
              applied[appliedKey] = marker;
              changed = ensureEvaluationsForSignedTargets() || changed;
              continue;
            }
            state.kpis = state.kpis.filter(item => !inResetScope(item));
            state.evals = state.evals.filter(item => !inResetScope(item));
            if (!resetMonth) {
              state.confirmedEmps = state.confirmedEmps.filter(id => id !== empId);
              state.archivedEmps = state.archivedEmps.filter(id => id !== empId);
            }
            for (const key of Object.keys(state.kpiDrafts)) {
              if (resetMonth ? key.startsWith(assessmentKey(empId, resetMonth) + '|') : key.startsWith(empId + '|')) delete state.kpiDrafts[key];
            }
            if (state.selectedKpiEmp === empId) state.editingKpi = null;
            for (let index = ARCHIVES.length - 1; index >= 0; index--) if (inResetScope(ARCHIVES[index])) ARCHIVES.splice(index, 1);
            deleteResultArchive(empId, resetMonth);
            try {
              for (const storageKey of ['kpi_selfeval_' + empId, 'kpi_signed_' + empId]) {
                if (!resetMonth) localStorage.removeItem(storageKey);
                else {
                  const stored = JSON.parse(localStorage.getItem(storageKey) || 'null');
                  if (stored && String(stored.month || '') === resetMonth) localStorage.removeItem(storageKey);
                }
              }
            } catch (_) {}
            applied[appliedKey] = marker;
            changed = true;
          }
          changed = ensureEvaluationsForSignedTargets() || changed;
          if (changed) {
            try { localStorage.setItem('perf_appliedWorkflowResets', JSON.stringify(applied)); } catch (_) {}
            try { localStorage.setItem('perf_kpiDrafts', JSON.stringify(state.kpiDrafts)); } catch (_) {}
            renderAfterBackgroundSync(true);
          }
        })
        .catch(() => {});

      // 1. Check localStorage (same-machine scenario)
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith('kpi_selfeval_')) {
            try {
              const data = JSON.parse(localStorage.getItem(key));
              if (!data || !data.empId || data.selfScore == null) continue;
              const empId = data.empId;
              const ev = state.evals.find(e => e.empId === empId && (!data.month || e.month === data.month));
              if (ev && ev.status === "\u5f85\u81ea\u8bc4") {
                ev.selfScore = data.selfScore;
                ev.status = "\u5f85\u4e0a\u7ea7\u8bc4\u5206";
                imported = true;
                console.log('\u5df2\u5bfc\u5165\u81ea\u8bc4\u5f97\u5206(localStorage):', empId, data.selfScore);
              }
              localStorage.removeItem(key);

            if (scoreChanged || resubmitted || ev.status === "\u5f85\u81ea\u8bc4") {

              ev.mgrScore = null;
              ev.bpScore = null;

        .catch(() => {});

      // 3. Fetch manager score data from server
      fetch(SYNC_SERVER_URL + '/mgr-data')
        .then(r => r.json())
        .then(mgrData => {
          mgrData = mgrData || {};

          for (const data of Object.values(mgrData)) changed = rememberEvaluationIdentity(data) || changed;
          for (const data of Object.values(mgrData)) {
            if (!data || data.mgrScore == null) continue;
            const empId = data.empId;
            if (!isValidServerAssessment(data, 'mgrScores', 'mgrScore')) {
              console.warn('已阻止导入异常上级评分:', empId, data.month, data.mgrScore);
              continue;
            }
            const ev = state.evals.find(e => e.empId === empId && e.month === data.month);
            changed = enrichEvaluationIdentity(ev, data) || changed;
            if (ev && (Number(ev.mgrScore) !== Number(data.mgrScore) || ev.status === "\u5f85\u4e0a\u7ea7\u8bc4\u5206" || ev.status === "\u5f85\u81ea\u8bc4")) {
              ev.mgrScore = data.mgrScore;
              ev.status = "\u5f85BP\u6838\u51c6";
              changed = true;
              console.log('\u5df2\u5bfc\u5165\u4e0a\u7ea7\u8bc4\u5206(\u670d\u52a1\u5668):', empId, data.mgrScore);
            }
          }
          state.evals.forEach(ev => {
            const serverRecord = assessmentRecord(mgrData, ev.empId, ev.month);
            if (ev.selfScore != null && ev.mgrScore != null && (!serverRecord || serverRecord.mgrScore == null)) {
              ev.mgrScore = null;
              ev.bpScore = null;
              ev.status = "\u5f85\u4e0a\u7ea7\u8bc4\u5206";
              changed = true;
            }
          });
          renderAfterBackgroundSync(changed);

        .catch(() => {});

      // 4. Fetch BP score data from server
      fetch(SYNC_SERVER_URL + '/bp-data')
        .then(r => r.json())
        .then(bpData => {
          bpData = bpData || {};
          let changed = false;
          for (const data of Object.values(bpData)) changed = rememberEvaluationIdentity(data) || changed;
          for (const data of Object.values(bpData)) {
            if (!data || data.bpScore == null) continue;
            const empId = data.empId;
            if (!isValidServerAssessment(data, 'bpScores', 'bpScore')) {
              console.warn('已阻止导入异常BP评分:', empId, data.month, data.bpScore);
              continue;

            const ev = state.evals.find(e => e.empId === empId && e.month === data.month);
            changed = enrichEvaluationIdentity(ev, data) || changed;

            }
          }
          state.evals.forEach(ev => {
            const serverRecord = assessmentRecord(bpData, ev.empId, ev.month);
            if (ev.mgrScore != null && ev.bpScore != null && (!serverRecord || serverRecord.bpScore == null)) {
              ev.bpScore = null;
              ev.status = "待BP核准";
              changed = true;
            }
          });
          renderAfterBackgroundSync(changed);
        })
        .catch(() => {});

      // 5. Fetch KPI confirmation data from server
      Promise.all([
        fetch(SYNC_SERVER_URL + '/kpi-data?summary=1').then(r => r.json()),
        fetch(SYNC_SERVER_URL + '/kpi-targets').then(r => r.json())
      ])
        .then(([kpiConfirmData, kpiTargetData]) => {
          kpiConfirmData = kpiConfirmData || {};
          kpiTargetData = kpiTargetData || {};
          const previousTargetKeys = state.submittedTargetKeys.slice().sort().join('||');
          state.submittedTargetKeys = Object.keys(kpiTargetData).filter(key => {
            const item = kpiTargetData[key];
            return item && item.emp && Array.isArray(item.kpis) && item.kpis.length > 0;
          });
          const nextTargetKeys = state.submittedTargetKeys.slice().sort().join('||');
          // The server is authoritative for every submitted employee/month
          // target, irrespective of who entered it or which browser is open.
          // Replacing the exact scope removes stale localStorage copies and
          // keeps all administrator accounts on the same real-time version.
          const reconciledServerTargets = reconcileServerTargets(kpiTargetData);
          const previousSignature = ARCHIVES.map(record => [record.empId, record.archivedAt || record.confirmedAt || '', record.archiveFile || ''].join('|')).sort().join('||');
          const serverArchives = Object.entries(kpiConfirmData)
            .filter(([, data]) => data && data.doc)
            .map(([key, data]) => ({ empId: data.empId || key.split('|')[0], name: data.name, realName: data.realName, month: data.month || key.split('|')[1] || DEFAULT_ASSESSMENT_MONTH, confirmedAt: data.signedAt, archivedAt: data.archivedAt, archiveFile: data.archiveFile, status: "已归档", doc: data.doc, integrity: data.integrity, identityVerification: data.identityVerification, auditEventHash: data.auditEventHash, signerContext: data.signerContext }));
          ARCHIVES.splice(0, ARCHIVES.length, ...serverArchives);
          let changed = reconciledServerTargets || previousTargetKeys !== nextTargetKeys || previousSignature !== serverArchives.map(record => [record.empId, record.archivedAt || record.confirmedAt || '', record.archiveFile || ''].join('|')).sort().join('||');
          state.confirmedEmps = serverArchives.map(record => record.empId);
          state.archivedEmps = serverArchives.map(record => record.empId);
          serverArchives.forEach(record => {
            const empId = record.empId;
            changed = rememberEvaluationIdentity(record) || changed;
            const data = assessmentRecord(kpiConfirmData, empId, record.month);
            // Auto-create eval record if not exists
            const empMonth = data.month || DEFAULT_ASSESSMENT_MONTH;
            const targetInfo = kpiTargetData[empId + '|' + empMonth];
            const hasLocalTargets = state.kpis.some(kpi => kpi.empId === empId && kpi.month === empMonth);
            if (!hasLocalTargets && targetInfo && Array.isArray(targetInfo.kpis) && targetInfo.kpis.length) {
              targetInfo.kpis.forEach((kpi, index) => {
                const items = Array.isArray(kpi.items) ? kpi.items.map(item => ({
                  indicator: String(item.indicator || ''), target: '', dataSource: kpiDataSourceValue(item),
                  rule: String(item.rule || ''), weight: Number(item.weight) || 0
                })) : [];
                state.kpis.push({
                  empId, month: empMonth, seq: Number(kpi.seq) || index + 1,
                  indicator: String(kpi.indicator || ''), target: '', dataSource: kpiDataSourceValue(kpi),
                  rule: String(kpi.rule || ''), weight: Number(kpi.weight) || 0, items
                });
              });
              changed = true;
              console.log('已恢复归档KPI只读明细:', empId, empMonth, targetInfo.kpis.length);
            }
            const hasEval = state.evals.find(e => e.empId === empId && e.month === empMonth);
            if (!hasEval) {
              const emp = employeeForEvaluation({ ...record, empId, month: empMonth });
              state.evals.push({ empId, month: empMonth, name: data.name || record.name || '', realName: data.realName || record.realName || '', dept: data.dept || emp?.dept || '', position: data.position || emp?.position || '', selfScore: null, mgrScore: null, bpScore: null, status: "待自评", directMgr: emp ? emp.directMgr : "" });
              changed = true;
              console.log('自动创建评估记录:', empId, empMonth);
            } else {
              changed = enrichEvaluationIdentity(hasEval, { ...record, ...data }) || changed;
            }
            console.log('已导入KPI确认书(服务器):', empId, data.name);
          });
          renderAfterBackgroundSync(changed);
        })
        .catch(() => {});

      // 6. Fetch result confirmation data from server
      fetch(SYNC_SERVER_URL + '/result-data?summary=1')
        .then(r => r.json())
        .then(resultConfirmData => {
          resultConfirmData = resultConfirmData || {};
          const previousSignature = Object.entries(window.RESULT_ARCHIVES || {}).map(([empId, data]) => [empId, data.bpReviewStatus || '', data.sealed || false, data.archivedAt || data.signedAt || '', data.archiveFile || ''].join('|')).sort().join('||');
          window.RESULT_ARCHIVES = Object.fromEntries(Object.entries(resultConfirmData).filter(([, data]) => data && data.doc));
          const nextSignature = Object.entries(window.RESULT_ARCHIVES).map(([empId, data]) => [empId, data.bpReviewStatus || '', data.sealed || false, data.archivedAt || data.signedAt || '', data.archiveFile || ''].join('|')).sort().join('||');
          let resultStatusChanged = false;
          for (const [key, data] of Object.entries(window.RESULT_ARCHIVES)) {
            const empId = String(data.empId || key.split('|')[0] || '');
            const month = String(data.month || key.split('|')[1] || '');
            const evaluation = state.evals.find(item => item.empId === empId && item.month === month);
            if (evaluation) {
              const nextStatus = data.sealed === true && data.archiveFile ? '已完成' : '待BP归档';
              if (evaluation.status !== nextStatus) { evaluation.status = nextStatus; resultStatusChanged = true; }
            }
            console.log('已导入绩效结果确认书(服务器):', empId, data.name);
          }
          renderAfterBackgroundSync(previousSignature !== nextSignature || resultStatusChanged);
        })
        .catch(() => {});

      lastSyncTime = new Date();
      return imported;
    }

    // Refresh submitted server state frequently and whenever this browser
    // becomes active, so different administrator accounts remain consistent.
    function startSyncPolling() {
      if (syncPollingTimer) return;
      syncPollingTimer = setInterval(() => { syncFromServer(); }, 5000);
      console.log('已启动服务端轮询兜底（每5秒）');

    function scheduleWorkflowEventRefresh(files) {
      (Array.isArray(files) ? files : []).forEach(file => pendingWorkflowEventFiles.add(String(file || '')));
      if (workflowEventRefreshTimer) clearTimeout(workflowEventRefreshTimer);
      workflowEventRefreshTimer = setTimeout(() => {
        workflowEventRefreshTimer = null;
        const changedFiles = [...pendingWorkflowEventFiles].filter(Boolean);
        pendingWorkflowEventFiles = new Set();
        if (changedFiles.length === 1 && changedFiles[0] === 'okr_workflows.json') {
          refreshOkrRecords().catch(() => {});
          return;
        }
        if (changedFiles.length === 1 && changedFiles[0] === 'monthly_events.json') {
          refreshMonthlyEvents(state.evalMonth).catch(() => {});
          return;
        }
        syncFromServer();
      }, 100);
    }

    function startWorkflowEventSync() {
      if (workflowEventSource || typeof EventSource !== 'function') return;
      try {
        workflowEventSource = new EventSource(SYNC_SERVER_URL + '/workflow-events');
        workflowEventSource.addEventListener('workflow-change', event => {
          let revision = 0;
          let files = [];
          try {
            const payload = JSON.parse(event.data || '{}');
            revision = Number(payload.revision) || 0;
            files = Array.isArray(payload.files) ? payload.files : [];
          } catch (_) {}
          if (revision && revision <= lastWorkflowEventRevision) return;
          if (revision) lastWorkflowEventRevision = revision;
          scheduleWorkflowEventRefresh(files);
        });
        workflowEventSource.addEventListener('open', () => console.log('后台流程实时同步已连接'));
        workflowEventSource.addEventListener('error', () => {
          // EventSource reconnects automatically; the existing five-second
          // polling loop remains the compatibility fallback.
        });
      } catch (_) {
        workflowEventSource = null;
      }
    }

    function autoImportSignedConfirmations() {
      let imported = false;
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith('kpi_signed_')) {
            try {
              const data = JSON.parse(localStorage.getItem(key));
              if (!data || !data.empId || !data.doc) continue;
              const empId = data.empId;
              // Update or create ARCHIVES record with real signed HTML
              const existing = ARCHIVES.findIndex(a => a.empId === empId);
              if (existing >= 0) {
                ARCHIVES[existing].doc = data.doc;
                ARCHIVES[existing].confirmedAt = data.signedAt;
              } else {
                ARCHIVES.push({ empId, month: data.month || DEFAULT_ASSESSMENT_MONTH, confirmedAt: data.signedAt, status: "已归档", doc: data.doc });
              }
              // Auto-confirm and archive
              if (!state.confirmedEmps.includes(empId)) state.confirmedEmps.push(empId);
              if (!state.archivedEmps.includes(empId)) state.archivedEmps.push(empId);
              // Clean up localStorage
              localStorage.removeItem(key);
              imported = true;
              console.log(`自动归档: ${data.name}(${data.realName}) - ${data.signedAt}`);
            } catch(e) {
              console.warn('解析签字确认书失败:', key, e);
            }
          }
        }
      } catch(e) {
        // localStorage不可用(file://协议)，静默跳过
      }
      return imported;
    }

    // Import on page load
    autoImportSignedConfirmations();

    document.addEventListener('keydown', event => {
      const dialog = document.querySelector('.modal-box');
      if (event.key === 'Escape' && dialog) {
        state.showSubmitModal = false;
        state.showConfirmModal = false;
        state.showResultModal = false;
        state.showSettingsModal = false;
        state.showSyncModal = false;
        state.managerEditorEmpId = null;
        state.evalStageDetail = null;
        state.monthlyEventEditor = null;
        state.monthlyEventImagePreview = null;
        render();
        return;
      }
      if (event.key === 'Tab' && dialog) {
        const focusable = [...dialog.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(item => !item.hidden);
        if (!focusable.length) { event.preventDefault(); dialog.focus(); return; }
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
      if ((event.key === 'ArrowLeft' || event.key === 'ArrowRight') && document.activeElement?.matches('[role="tab"]')) {
        const tabs = [...document.querySelectorAll('[role="tab"]')];
        const current = tabs.indexOf(document.activeElement);
        const offset = event.key === 'ArrowRight' ? 1 : -1;
        const next = tabs[(current + offset + tabs.length) % tabs.length];
        event.preventDefault(); next.click(); next.focus();
      }
    });

    // Initial render
    render();
    syncFromServer();
    refreshMonthlyEvents(state.evalMonth).catch(() => {});
    startWorkflowEventSync();
    window.addEventListener('focus', () => syncFromServer());

    // ===== 当前绩效节点催办 =====
    async function sendWorkflowReminder(empId, month, action, options = {}) {
      const silent = !!options.silent;
      const emp = state.employees.find(item => item.id === empId);
      const evaluation = state.evals.find(item => item.empId === empId && item.month === month);
      if (!emp) {
        if (!silent) alert('未找到员工记录');
        return { success: false, error: '未找到员工记录' };
      }
      if (evaluation && validResultArchiveFor(empId, month, evaluation)?.doc) {
        if (!silent) alert('绩效结果已经签字归档，无需催办');
        return { success: false, error: '绩效结果已经签字归档' };
      }

      try {
        const response = await fetch(SYNC_SERVER_URL + '/workflow-reminder', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ empId, month, action: action || 'reminder' })
        });
        const result = await response.json();
        if (response.ok && (result.accepted || result.success || result.sent || result.queued)) {
          const deliveryText = result.sent ? '已发送' : '已进入发送队列';
          const actionLabel = result.actionType === 'send-self-evaluation' ? '自评通知' : (result.actionType === 'remind-self-evaluation' ? '自评催办' : '“' + result.status + '”催办');
          if (!silent) alert('已向' + result.recipientRole + '“' + result.recipientName + '”发送' + actionLabel + '。\n' + deliveryText + '。');
          return { success: true, ...result };
        }
        throw new Error(result.error || '钉钉通道发送失败');
      } catch (error) {
        if (!silent) alert('通知发送失败：' + error.message);
        return { success: false, error: error.message };
      }
    }

        </div>
        <div style="padding:12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;text-align:center">
          <div style="font-size:20px;font-weight:700;color:#2563eb">${signedCount}</div>
          <div style="font-size:12px;color:#1d4ed8">已签名归档</div>
        </div>
        <div style="padding:12px;background:${unsignedCount > 0 ? '#fffbeb' : '#f9fafb'};border:1px solid ${unsignedCount > 0 ? '#fde68a' : '#e5e7eb'};border-radius:10px;text-align:center">
          <div style="font-size:20px;font-weight:700;color:${unsignedCount > 0 ? '#d97706' : '#6b7280'}">${unsignedCount}</div>
          <div style="font-size:12px;color:${unsignedCount > 0 ? '#92400e' : '#6b7280'}">待签名</div>
        </div>
      </div>`;

      if (completed.length === 0) {
        html += `<div style="text-align:center;padding:40px;color:#9ca3af">暂无已完成的绩效评估</div>`;
      } else {
        html += `<div class="space-y-2">`;
        completed.forEach(ev => {
          const emp = state.employees.find(e => e.id === ev.empId);
          const grade = getGrade(ev.bpScore);
          const arch = validResultArchiveFor(ev.empId, ev.month, ev);
          const isSigned = !!arch;
          const pendingBpArchive = resultArchiveFor(ev.empId, ev.month)?.bpReviewStatus === 'pending';
          const archiveTime = arch && arch.archivedAt ? new Date(arch.archivedAt).toLocaleString('zh-CN', { hour12: false }) : (arch && arch.signedAt ? arch.signedAt : '');

          html += `<div class="flex items-center justify-between" style="padding:12px 16px;border:1px solid ${isSigned ? '#86efac' : '#fde68a'};border-radius:10px;background:${isSigned ? '#f0fdf4' : '#fffbeb'}">
            <div class="flex items-center gap-3">
              <div style="width:32px;height:32px;border-radius:50%;background:${isSigned ? '#059669' : '#d97706'};color:white;display:flex;align-items:center;justify-content:center;font-size:14px">${isSigned ? '📁' : '⏳'}</div>
              <div>
                <div class="text-sm font-medium text-gray-900">${emp?.name}（${emp?.realName}）</div>
                <div class="text-xs text-gray-500">${emp?.dept} · ${emp?.position} · 得分 ${ev.bpScore} · ${grade?.grade || '--'}</div>
                ${isSigned && archiveTime ? `<div class="text-xs" style="color:#059669;margin-top:2px">归档时间：${archiveTime}</div>` : ''}
                ${isSigned && arch.archiveFile ? `<div class="text-xs text-gray-500" style="margin-top:2px">归档文件：${arch.archiveFile}</div>` : ''}
              </div>
            </div>
            <div class="flex items-center gap-2">`;

          if (isSigned) {
            html += `<span class="badge badge-green" style="font-size:12px">已归档</span>
              <button class="btn btn-secondary btn-sm" data-view-result="${ev.empId}" data-record-month="${ev.month}" title="查看签字确认书">查看</button>`;
          } else if (pendingBpArchive) {
            const bpReviewLink = resultArchiveFor(ev.empId, ev.month)?.bpReviewLink || '';
            html += `<span class="badge badge-blue" style="font-size:12px">员工已签，等待BP复核归档</span>${bpReviewLink ? `<a class="btn btn-primary btn-sm" href="${escapeHtml(bpReviewLink)}" target="_blank" rel="noopener">BP结果核对</a>` : ''}`;
          } else {
            html += `<span class="badge badge-amber" style="font-size:12px">等待员工在线签字</span>`;
          }

          html += `</div></div>`;
        });
        html += `</div>`;
      }

      html += `<div class="flex justify-end" style="margin-top:20px;padding-top:16px;border-top:1px solid #e5e7eb">
        <button class="btn btn-primary btn-sm" data-close-result-modal>完成</button>
      </div>
        </div>
      </div>`;

      return html;
    }

    function renderSettingsModal() {
      return `<div class="modal-overlay" data-settings-modal-overlay>
        <div class="modal-box" style="max-width:500px">
          <div class="flex items-center justify-between mb-4">
            <h2>️ 钉钉通知设置</h2>
            <button class="close-btn" data-close-settings>✕</button>
          </div>
          <div class="space-y-4">
            <div>
              <label class="text-sm font-medium text-gray-700" style="display:block;margin-bottom:8px">钉钉通知方式</label>
              <div style="padding:12px;background:#f0fdf4;border:1px solid #86efac;border-radius:8px;margin-bottom:8px">
                <div class="text-sm font-medium" style="color:#059669">✅ 机器人单聊消息（已启用）</div>
                <div class="text-xs" style="color:#047857;margin-top:4px">通过钉钉机器人向每位员工发送私聊消息，不暴露个人账号</div>
              </div>
              <p class="text-xs text-gray-500">系统将通过已配置的企业通知通道发送消息；发送状态和失败重试由后台统一管理。</p>
            </div>
            <div style="padding:12px;background:#fffbeb;border:1px solid #fcd34d;border-radius:8px">
              <div class="text-sm font-medium" style="color:#92400e">📨 待发送队列</div>
              <div id="queue-status" class="text-xs" style="color:#78350f;margin-top:4px">检查中...</div>
              <button class="btn btn-sm" id="btn-check-queue" style="margin-top:8px;padding:4px 12px;font-size:12px;background:#f59e0b;color:#fff;border:none;border-radius:4px;cursor:pointer">刷新队列状态</button>
            </div>
            <div class="alert alert-blue" style="font-size:13px">
              <strong>通知触发场景：</strong><br>
              1. KPI目标提交 → 机器人给员工发目标确认通知<br>
              2. 自评提醒 → 机器人给员工发自评提醒<br>
              3. 评估提交 → 机器人通知下一环节负责人<br>
              4. BP核准完成 → 机器人通知员工确认结果
            </div>
            <div class="alert alert-info" style="font-size:12px">
              <strong>发送保障：</strong>发送失败的通知会自动进入重试队列，管理员可在本页查看通道状态并重新触发。
            </div>
            <div class="flex justify-end gap-2 mt-4">
              <button class="btn btn-secondary" data-close-settings>关闭</button>
            </div>
          </div>
        </div>
      </div>`;
    }
    function renderSyncModal() {
      const sr = state.syncResult;
      if (!sr) return '';
      const { newEmps, departed, matched, total } = sr;
      let body = '';

      if (sr.loading) {
        body = '<div style="text-align:center;padding:32px"><div style="font-size:24px;margin-bottom:12px">⏳</div><div class="text-gray-500">正在获取钉钉通讯录数据...</div></div>';
      } else if (sr.error) {
        const helpText = window.location.protocol === 'file:'
          ? '请确认本地服务正在运行（端口 18082）'
          : '请刷新页面后重试；若仍失败，请联系系统管理员检查服务状态。';
        body = '<div style="text-align:center;padding:32px"><div style="font-size:24px;margin-bottom:12px">❌</div><div style="color:#dc2626">' + sr.error + '</div><div class="text-xs text-gray-500" style="margin-top:8px">' + helpText + '</div></div>';
      } else {
        // Summary
        body += '<div class="card" style="padding:12px;margin-bottom:12px;background:#f0fdf4"><div class="flex items-center gap-3"><span style="font-size:20px">📊</span><div><div class="font-medium text-sm">钉钉通讯录: ' + total + ' 人</div><div class="text-xs text-gray-500">系统已有: ' + matched.length + ' 人匹配</div></div></div></div>';

        // New employees
        if (newEmps.length > 0) {
          body += '<div style="margin-bottom:12px"><div class="font-medium text-sm mb-2" style="color:#059669">🆕 新入职（' + newEmps.length + ' 人，系统中尚无）</div>';
          body += '<table style="width:100%;font-size:13px"><thead><tr><th style="width:30px"></th><th>花名</th><th>真实姓名</th><th>部门</th><th>岗位</th></tr></thead><tbody>';
          newEmps.forEach((emp, i) => {
            body += '<tr><td><input type="checkbox" class="sync-check-new" data-new-idx="' + i + '" checked></td><td>' + emp.nick + '</td><td>' + emp.realName + '</td><td>' + emp.department + '</td><td>' + (emp.title || '--') + '</td></tr>';
          });
          body += '</tbody></table></div>';
        }

        // Departed
        if (departed.length > 0) {
          body += '<div style="margin-bottom:12px"><div class="font-medium text-sm mb-2" style="color:#dc2626">⚠️ 钉钉中已不存在（' + departed.length + ' 人，可能已离职）</div>';
          body += '<div class="flex flex-wrap gap-1">';
          departed.forEach(emp => {
            body += '<span class="badge badge-red" style="font-size:12px">' + emp.name + '(' + emp.realName + ')</span>';
          });
          body += '</div><div class="text-xs text-gray-500" style="margin-top:4px">离职人员在' + state.empMonth + '继续保留，自下月起退出考核名单；历史目标、评分与归档数据不会删除。</div></div>';
        }

        if (newEmps.length === 0 && departed.length === 0) {
          body += '<div style="text-align:center;padding:16px;color:#059669">✅ 系统与钉钉通讯录完全一致，无需更新</div>';
        }
      }

      return '<div class="modal-overlay" data-sync-modal-overlay><div class="modal-box" style="max-width:600px"><div class="flex items-center justify-between mb-4"><h2>🔄 通讯录同步</h2><button class="close-btn" data-close-sync>✕</button></div>' + body + '<div class="flex justify-end gap-2 mt-4">' + (sr.loading || sr.error ? '<button class="btn btn-secondary" data-close-sync>关闭</button>' : (newEmps.length > 0 ? '<button class="btn btn-secondary" data-close-sync>取消</button><button class="btn btn-primary" data-add-new-emps>添加选中 (' + newEmps.filter((_,i) => true).length + ' 人)</button>' : '<button class="btn btn-primary" data-close-sync>确定</button>')) + '</div></div></div>';
    }
</script>
</body>
</html>
